<!doctype html>
<html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="logo.svg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087cf0"><title>MYGRAM | الخدمات</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="config.js"></script><script defer src="auth-guard.js"></script><script defer src="services.js"></script>
<style>.services-wrap{max-width:1050px;margin:24px auto;padding:0 16px}.services-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.service-card{padding:20px;min-width:0}.service-card form{display:grid;gap:10px;margin:12px 0}.service-card input,.service-card textarea,.service-card select{width:100%;padding:11px;border:1px solid #dce5f0;border-radius:11px;font:inherit}.service-card textarea{min-height:78px}.service-card button{border:0;border-radius:10px;padding:10px 14px;background:#087cf0;color:white;cursor:pointer}.service-card button:disabled{opacity:.5}.item{padding:12px;border:1px solid #e7edf5;border-radius:12px;margin:10px 0;overflow-wrap:anywhere}.item img,.item video{max-width:100%;max-height:280px;border-radius:10px;display:block}.service-list{max-height:450px;overflow:auto}.service-card h2{margin-top:0}.muted{color:#718096;font-size:13px}.member-result{display:flex;gap:8px;align-items:center;padding:8px;border-bottom:1px solid #edf2f7}.member-result button{margin-inline-start:auto}.chat-messages{max-height:300px;overflow:auto}.reel-reactions{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.reel-reactions button[aria-pressed="true"]{outline:2px solid #087cf0;background:#eaf4ff}.reel-comment-form{display:flex;gap:8px;margin-top:8px}.reel-comment-form input{flex:1;min-width:0}.reel-comment-list{margin-top:8px}.services-wrap .button{display:inline-block}@media(max-width:600px){.services-wrap{padding:0 10px}.service-card{padding:14px}}</style><script defer src="language.js"></script>
</head>
<body><header class="topbar" style="padding:0 20px"><a class="brand" href="home.html"><span class="brand-symbol"><img src="logo.svg" alt="MYGRAM" class="brand-icon"></span><span>MY<span class="brand-blue">GRAM</span></span></a><nav><a href="home.html">الرئيسية</a> · <a href="people.html">الأصدقاء</a> · <a href="profile.html">ملفي الشخصي</a> · <a href="communities.html">المجتمعات</a> · <a href="chat.html">MYGRAM Chat</a></nav></header>
<main class="services-wrap"><section class="welcome-banner"><div><span class="eyebrow">MYGRAM SERVICES</span><h1>الخدمات والتواصل</h1><p>القصص، الرسائل المباشرة، الريلز، والبث المباشر.</p></div><div class="banner-mark"><img src="logo.svg" alt="MYGRAM" class="brand-icon-large"></div></section>
<div class="services-grid" style="margin-top:16px">
<section class="card service-card"><h2>◉ القصص</h2><form id="storyForm"><label for="storyMedia">صورة أو فيديو للقصة</label><input id="storyMedia" type="file" accept="image/*,video/*" required><label for="storyCaption">تعليق اختياري</label><textarea id="storyCaption" maxlength="500" placeholder="أضف تعليقاً…"></textarea><button type="submit">نشر قصة لمدة 24 ساعة</button></form><div id="storiesList" class="service-list"><p class="muted">جارٍ التحميل…</p></div></section>
<section class="card service-card"><h2>▶ الريلز</h2><form id="reelForm"><label for="reelVideo">الفيديو</label><input id="reelVideo" type="file" accept="video/*" required><label for="reelCaption">الوصف</label><textarea id="reelCaption" maxlength="500" placeholder="اكتب وصف الفيديو…"></textarea><button type="submit">نشر ريل</button></form><div id="reelsList" class="service-list"><p class="muted">جارٍ التحميل…</p></div></section>
<section class="card service-card"><h2>🔴 البث المباشر</h2><form id="liveForm"><label for="liveTitle">عنوان البث</label><input id="liveTitle" maxlength="120" placeholder="عنوان البث" required><button type="submit">إنشاء جلسة بث مجدولة</button></form><div id="liveList" class="service-list"><p class="muted">جارٍ التحميل…</p></div></section>
<section class="card service-card"><h2>💬 الرسائل المباشرة</h2><label for="memberSearch">ابحث عن مستلم</label><input id="memberSearch" placeholder="اسم المستخدم أو الاسم"><div id="membersResults" class="service-list"></div><label for="messageUsername">اسم مستخدم المستلم</label><input id="messageUsername" placeholder="username"><button id="loadChat" type="button">فتح المحادثة</button><div id="chatBox" class="chat-messages service-list"></div><form id="messageForm"><label for="messageBody">رسالتك</label><textarea id="messageBody" maxlength="10000" placeholder="اكتب رسالة أو أرفق وسائط…"></textarea><label for="messageAttachment">إرفاق صورة أو فيديو أو ملف صوتي</label><input id="messageAttachment" type="file" accept="image/*,video/*,audio/*"><div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0"><button id="recordVoiceButton" type="button" class="button ghost small">🎙️ تسجيل رسالة صوتية</button><span id="voiceRecordStatus" class="muted" role="status" aria-live="polite"></span></div><button type="submit">إرسال الرسالة</button></form></section>
</div></main><div id="toast" class="toast" role="status" aria-live="polite"></div></body></html>
