    <script>
        function register() {
            const username = document.getElementById('username').value;
            const msgDiv = document.getElementById('msg');

            if (!username) {
                msgDiv.style.color = '#f87171';
                msgDiv.innerText = 'الرجاء إدخال اسم المستخدم';
                return;
            }

            // حفظ اسم المستخدم في ذاكرة التطبيق المحلية
            localStorage.setItem('mygram_username', username);

            msgDiv.style.color = '#38bdf8';
            msgDiv.innerText = 'جاري تسجيل الدخول...';

            setTimeout(() => {
                window.location.href = 'home.html';
            }, 1000);
        }
    </script>
