<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYGRAM - Global Portal</title>
    <style>
        :root {
            --bg-main: #0b1120;
            --card-bg: #152238;
            --primary: #38bdf8;
            --primary-gradient: linear-gradient(135deg, #0284c7, #38bdf8);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #1e293b;
        }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg-main); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; box-sizing: border-box; }
        .auth-card { background: var(--card-bg); padding: 30px; border-radius: 20px; width: 100%; max-width: 420px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); border: 1px solid #1e293b; text-align: center; }
        h1 { color: var(--primary); margin: 0 0 5px; font-size: 28px; font-weight: 900; letter-spacing: 1px; }
        .sub-slogan { color: var(--text-sub); font-size: 11px; margin-bottom: 20px; }
        input, select { width: 100%; padding: 12px 14px; margin-bottom: 12px; background: #0b1120; border: 1px solid var(--border); color: #fff; border-radius: 10px; box-sizing: border-box; font-size: 13px; outline: none; }
        input:focus { border-color: var(--primary); }
        button { width: 100%; padding: 13px; background: var(--primary-gradient); color: #fff; border: none; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 5px; box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3); }
        button:hover { opacity: 0.95; }
        .toggle-link { margin-top: 15px; font-size: 12px; color: var(--text-sub); cursor: pointer; }
        .toggle-link span { color: var(--primary); font-weight: bold; }
        .age-warning { font-size: 10px; color: #ef4444; margin-top: -8px; margin-bottom: 10px; text-align: right; }
    </style>
</head>
<body>

    <div class="auth-card">
        <h1>MYGRAM</h1>
        <div class="sub-slogan">Everything you need is here</div>
        
        <div id="nameField" style="display:none;">
            <input type="text" id="fullName" placeholder="الاسم الكامل">
            <input type="date" id="birthDate" placeholder="تاريخ الميلاد">
            <div class="age-warning">* يجب أن يكون عمرك 16 عاماً أو أكثر للتسجيل.</div>
        </div>
        <input type="email" id="emailInput" placeholder="البريد الإلكتروني">
        <input type="tel" id="phoneInput" placeholder="رقم الهاتف الدولي">
        <input type="password" id="password" placeholder="كلمة السر">
        
        <button id="actionBtn" onclick="handleAuth()">تسجيل الدخول</button>
        
        <div class="toggle-link" onclick="toggleMode()">
            <span id="toggleText">ليس لديك حساب؟ انضم إلينا الآن</span>
        </div>
    </div>

    <script>
        let isSignup = false;

        function toggleMode() {
            isSignup = !isSignup;
            document.getElementById('nameField').style.display = isSignup ? 'block' : 'none';
            document.getElementById('actionBtn').innerText = isSignup ? 'إنشاء حساب جديد' : 'تسجيل الدخول';
            document.getElementById('toggleText').innerText = isSignup ? 'لديك حساب بالفعل؟ سجل دخولك' : 'ليس لديك حساب؟ انضم إلينا الآن';
        }

        function calculateAge(birthdate) {
            const birth = new Date(birthdate);
            const today = new Date();
            let age = today.getFullYear() - birth.getFullYear();
            const m = today.getMonth() - birth.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
            return age;
        }

        function handleAuth() {
            const email = document.getElementById('emailInput').value.trim();
            const phone = document.getElementById('phoneInput').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if ((!email && !phone) || !password) {
                alert('الرجاء إدخال البريد الإلكتروني أو رقم الهاتف وكلمة السر!');
                return;
            }

            let userName = email ? email.split('@')[0] : phone;
            let userAge = 18;

            if (isSignup) {
                const fullName = document.getElementById('fullName').value.trim();
                const birthDate = document.getElementById('birthDate').value;
                if (!birthDate) {
                    alert('الرجاء إدخال تاريخ الميلاد للتحقق من السن القانوني!');
                    return;
                }
                userAge = calculateAge(birthDate);
                if (userAge < 16) {
                    alert('عذراً، يجب أن يكون عمرك 16 سنة أو أكثر لإنشاء حساب على MYGRAM!');
                    return;
                }
                if (fullName) userName = fullName;
            }

            localStorage.setItem('mygram_username', userName);
            localStorage.setItem('mygram_email', email);
            localStorage.setItem('mygram_phone', phone);
            localStorage.setItem('mygram_age', userAge);
            window.location.href = 'home.html';
        }
    </script>
</body>
</html>
