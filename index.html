<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYGRAM - تسجيل الدخول</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-card { background: #1e293b; padding: 25px; border-radius: 12px; width: 100%; max-width: 380px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: 1px solid #334155; text-align: center; }
        h2 { color: #38bdf8; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 12px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 5px; }
        button:hover { background: #0ea5e9; }
        .toggle-link { margin-top: 15px; font-size: 13px; color: #94a3b8; cursor: pointer; }
        .toggle-link span { color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2 id="formTitle">تسجيل الدخول إلى MYGRAM</h2>
        
        <div id="nameField" style="display:none;">
            <input type="text" id="fullName" placeholder="الاسم الكامل">
        </div>
        <input type="text" id="identifier" placeholder="البريد الإلكتروني أو رقم الهاتف">
        <input type="password" id="password" placeholder="كلمة السر">
        
        <button id="actionBtn" onclick="handleAuth()">تسجيل الدخول</button>
        
        <div class="toggle-link" onclick="toggleMode()">
            <span id="toggleText">ليس لديك حساب؟ إنشاء حساب جديد</span>
        </div>
    </div>

    <script>
        let isSignup = false;

        function toggleMode() {
            isSignup = !isSignup;
            document.getElementById('formTitle').innerText = isSignup ? 'إنشاء حساب جديد' : 'تسجيل الدخول إلى MYGRAM';
            document.getElementById('nameField').style.display = isSignup ? 'block' : 'none';
            document.getElementById('actionBtn').innerText = isSignup ? 'إنشاء الحساب' : 'تسجيل الدخول';
            document.getElementById('toggleText').innerText = isSignup ? 'لديك حساب بالفعل؟ سجل دخولك' : 'ليس لديك حساب؟ إنشاء حساب جديد';
        }

        function handleAuth() {
            const identifier = document.getElementById('identifier').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if (!identifier || !password) {
                alert('الرجاء تعبئة جميع الحقول المطلوبة!');
                return;
            }

            if (isSignup) {
                const fullName = document.getElementById('fullName').value.trim();
                if (!fullName) {
                    alert('الرجاء إدخال الاسم الكامل!');
                    return;
                }
                localStorage.setItem('mygram_username', fullName);
                localStorage.setItem('mygram_identifier', identifier);
                alert('تم إنشاء الحساب بنجاح!');
            } else {
                // تسجيل دخول افتراضي واعتماد المُدخل كاسم أو بريد
                localStorage.setItem('mygram_username', identifier.split('@')[0]);
            }

            window.location.href = 'home.html';
        }
    </script>
</body>
</html>
