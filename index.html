<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6254e8">
  <title>MYGRAM — تسجيل الدخول</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="config.js"></script>
  <script defer src="auth.js"></script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-brand">
      <a class="brand" href="index.html" aria-label="MYGRAM">
        <span class="brand-mark">M</span><span class="brand-word">MY<span>GRAM</span></span>
      </a>
      <h1>عالمك، أصدقاؤك، حكايتك.</h1>
      <p>مساحتك لمشاركة الأفكار واللحظات والتواصل مع مجتمعك.</p>
      <div class="brand-orbit" aria-hidden="true"><span>💬</span><span>♡</span><span>✦</span></div>
    </section>

    <section class="auth-card panel">
      <div class="auth-tabs" role="tablist" aria-label="تسجيل الدخول أو إنشاء حساب">
        <button class="auth-tab active" id="loginTab" type="button">تسجيل الدخول</button>
        <button class="auth-tab" id="signupTab" type="button">إنشاء حساب</button>
      </div>
      <h2 id="formTitle">أهلاً بعودتك 👋</h2>
      <p class="muted" id="formSubtitle">سجّل الدخول للمتابعة إلى MYGRAM.</p>

      <form id="authForm">
        <label id="nameLabel" class="field hidden" for="fullName">الاسم الظاهر
          <input id="fullName" name="fullName" type="text" maxlength="80" autocomplete="name" placeholder="اكتب اسمك">
        </label>
        <label class="field" for="email">البريد الإلكتروني
          <input id="email" name="email" type="email" autocomplete="email" required placeholder="name@example.com">
        </label>
        <label class="field" for="password">كلمة المرور
          <input id="password" name="password" type="password" minlength="6" autocomplete="current-password" required placeholder="6 أحرف على الأقل">
        </label>
        <button class="button primary full" id="submitButton" type="submit">تسجيل الدخول</button>
      </form>
      <div class="notice" id="authNotice" role="status" aria-live="polite"></div>
      <p class="tiny muted">بحسابك، يمكنك نشر محتوى نصّي محفوظ في قاعدة بيانات MYGRAM.</p>
    </section>
  </main>
  <footer class="site-footer">© <span id="year"></span> MYGRAM</footer>
</body>
</html>
