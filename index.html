<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYGRAM - تسجيل الدخول وإنشاء حساب</title>
    <style>
        :root{--bg:#0b1120;--card:#152238;--p:#38bdf8;--ink:#f8fafc;--mute:#94a3b8;--line:#1e293b;--red:#ef4444;--ok:#22c55e;--gold:#f59e0b}
        *{box-sizing:border-box;margin:0}
        body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
        .auth-container { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .logo-box { text-align: center; margin-bottom: 20px; }
        .logo-box h1 { color: var(--p); font-size: 24px; font-weight: 900; margin-bottom: 4px; }
        .logo-box p { color: var(--mute); font-size: 11px; }
        input,select{width:100%;padding:12px 14px;margin-bottom:12px;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:12px;font:inherit;font-size:13px;outline:none;}
        button{width:100%;font:inherit;font-size:13px;cursor:pointer;border:0;background:var(--p);color:#06101d;border-radius:12px;padding:12px;font-weight:800;display:flex;justify-content:center;align-items:center;margin-top:6px}
        .tab-bar { display: flex; gap: 8px; margin-bottom: 20px; background: var(--bg); padding: 4px; border-radius: 12px; border: 1px solid var(--line); }
        .tab-btn { flex: 1; padding: 10px; text-align: center; background: none; border: 0; color: var(--mute); font-size: 12px; font-weight: 700; cursor: pointer; border-radius: 8px; }
        .tab-btn.active { background: var(--p); color: #06101d; }
        .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--p);color:#06101d;padding:9px 20px;border-radius:20px;font-size:12px;font-weight:800;z-index:3000;opacity:0;transition:opacity .3s;pointer-events:none}
        .toast.on{opacity:1}
        .mute-label { font-size: 11px; color: var(--mute); margin-bottom: 4px; display: block; text-align: right; }
    </style>
</head>
<body>
    <div class="toast" id="toastMsg"></div>
    <div class="auth-container">
        <div class="logo-box">
            <h1>MYGRAM</h1>
            <p>منصة التواصل الاجتماعي العالمية</p>
        </div>
        <div class="tab-bar">
            <button class="tab-btn active" id="tabLoginBtn" onclick="switchAuthMode('login')">تسجيل الدخول</button>
            <button class="tab-btn" id="tabRegisterBtn" onclick="switchAuthMode('register')">إنشاء حساب جديد</button>
        </div>
        <div id="loginFormSection">
            <label class="mute-label">البريد الإلكتروني أو اسم المستخدم:</label>
            <input type="text" id="loginEmail" placeholder="example@mygram.com" value="louay@mygram.com">
            <label class="mute-label">كلمة المرور:</label>
            <input type="password" id="loginPass" placeholder="••••••••" value="123456">
            <button onclick="handleLogin()">تسجيل الدخول الفوري</button>
        </div>
        <div id="registerFormSection" style="display: none;">
            <label class="mute-label">الاسم الكامل:</label>
            <input type="text" id="regName" placeholder="الاسم...">
            <label class="mute-label">البريد الإلكتروني:</label>
            <input type="email" id="regEmail" placeholder="example@mygram.com">
            <label class="mute-label">كلمة المرور:</label>
            <input type="password" id="regPass" placeholder="••••••••">
            <button onclick="handleRegister()">إنشاء الحساب والانتقال</button>
        </div>
    </div>
    <script>
        function showToast(msg) {
            const t = document.getElementById('toastMsg');
            if(!t) return;
            t.innerText = msg;
            t.classList.add('on');
            setTimeout(() => t.classList.remove('on'), 2000);
        }
        function switchAuthMode(mode) {
            document.getElementById('loginFormSection').style.display = mode === 'login' ? 'block' : 'none';
            document.getElementById('registerFormSection').style.display = mode === 'register' ? 'block' : 'none';
            document.getElementById('tabLoginBtn').classList.toggle('active', mode === 'login');
            document.getElementById('tabRegisterBtn').classList.toggle('active', mode === 'register');
        }
        function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const pass = document.getElementById('loginPass').value;
            const defaultAcc = {
                name: "Louay Chaghal",
                account: email || "louay@mygram.com",
                pass: pass || "123456",
                birthDate: "1995-01-01",
                age: 31,
                gender: "male",
                relation: "متزوج",
                hobbies: "البرمجة وتقنية المصاعد",
                avatar: ""
            };
            localStorage.setItem('mygram_current_account', JSON.stringify(defaultAcc));
            localStorage.setItem('mygram_is_logged', 'true');
            showToast('تم تسجيل الدخول بنجاح!');
            setTimeout(() => { window.location.href = 'home.html'; }, 600);
        }
        function handleRegister() {
            handleLogin();
        }
    </script>
</body>
</html>
