<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYGRAM</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; width: 320px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h1 { color: #38bdf8; margin-bottom: 20px; text-align: center; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border-radius: 6px; border: none; background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; }
        button:hover { background: #0ea5e9; }
        #msg { margin-top: 15px; font-size: 14px; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h1>MYGRAM</h1>
        <input type="text" id="username" placeholder="اسم المستخدم">
        <input type="email" id="email" placeholder="البريد الإلكتروني">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button onclick="register()">إنشاء حساب / دخول</button>
        <div id="msg"></div>
    </div>

    <script>
        function register() {
            const username = document.getElementById('username').value;
            const msgDiv = document.getElementById('msg');

            if (!username) {
                msgDiv.style.color = '#f87171';
                msgDiv.innerText = 'الرجاء إدخال اسم المستخدم';
                return;
            }

            msgDiv.style.color = '#38bdf8';
            msgDiv.innerText = 'جاري تسجيل الدخول...';

            setTimeout(() => {
                msgDiv.style.color = '#4ade80';
                msgDiv.innerText = 'أهلاً بك، تم تسجيل الدخول بنجاح!';
            }, 1000);
        }
    </script>
</body>
</html>
