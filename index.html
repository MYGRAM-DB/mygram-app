<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1769e0"><title>MYGRAM</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div id="toast"></div><section id="auth" class="auth"><div class="authcard"><div class="logo">M</div><h1>MYGRAM</h1><p>لحظاتك وأصدقاؤك بمكان واحد 💙</p><div class="tabs"><button id="loginTab" class="active">دخول</button><button id="signupTab">إنشاء حساب</button></div><form id="authForm"><label>البريد الإلكتروني<input id="email" type="email" required autocomplete="email"></label><label id="fullLabel" hidden>الاسم الكامل<input id="fullName" autocomplete="name"></label><label>كلمة المرور<input id="password" type="password" minlength="6" required autocomplete="current-password"></label><button class="primary wide" id="authSubmit">تسجيل الدخول</button></form><details><summary>إعداد الاتصال</summary><p>راجع رابط Supabase ومفتاح Publishable أعلى ملف app.js. لا تستخدم مفتاح service_role في الواجهة.</p></details></div></section><div id="app" hidden><header><a class="brand" href="#" data-page="home"><span class="logo mini">M</span> MYGRAM</a><input id="search" placeholder="ابحث عن أشخاص..."><nav><button data-page="home">⌂</button><button data-page="friends">♧</button><button data-page="messages">✉</button><button data-page="profile">◉</button><button id="logout">↪</button></nav></header><div class="layout"><aside class="left"><div id="me" class="person"></div><button data-page="home">🏠 الرئيسية</button><button data-page="profile">👤 الملف الشخصي</button><button data-page="friends">👥 اكتشف الأشخاص</button><button data-page="messages">💬 الرسائل</button><button data-page="reels">🎬 Reels</button><div class="note">MYGRAM<br><small>شارك لحظاتك بلطف.</small></div></aside><main id="main"></main><aside class="right"><section class="card"><h3>✨ أشخاص قد تعرفهم</h3><p class="muted">اكتشف المستخدمين المسجلين.</p><button class="outline wide" data-page="friends">عرض الأشخاص</button></section><section class="card"><h3>💙 مجتمع MYGRAM</h3><p>تواصل، شارك، وكن لطيفًا.</p></section></aside></div><footer><button data-page="home">⌂<small>الرئيسية</small></button><button data-page="friends">♧<small>الأشخاص</small></button><button data-page="messages">✉<small>الرسائل</small></button><button data-page="profile">◉<small>ملفي</small></button></footer></div><dialog id="edit"><form id="profileForm"><button type="button" id="close" class="close">×</button><h2>تعديل الملف الشخصي</h2><label>الاسم<input id="pname" required maxlength="80"></label><label>اسم المستخدم<input id="puser" required minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+"></label><label>نبذة<textarea id="pbio" maxlength="300"></textarea></label><button class="primary wide">حفظ</button></form></dialog><script src="app.js"></script></body></html>
