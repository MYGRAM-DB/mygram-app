<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYGRAM - Portal</title>
    <style>
        :root {
            --bg-main: #0b1120;
            --card-bg: #152238;
            --primary: #38bdf8;
            --primary-gradient: linear-gradient(135deg, #0284c7, #38bdf8);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #1e293b;
            --error-red: #ef4444;
            --success-green: #22c55e;
        }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg-main); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; box-sizing: border-box; }
        .auth-card { background: var(--card-bg); padding: 30px; border-radius: 20px; width: 100%; max-width: 420px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); border: 1px solid var(--border); text-align: center; position: relative; }
        .lang-picker-top { position: absolute; top: 15px; right: 15px; }
        html[dir="ltr"] .lang-picker-top { right: auto; left: 15px; }
        select.lang-select { background: #0b1120; color: var(--primary); border: 1px solid var(--border); border-radius: 6px; font-size: 11px; padding: 4px 8px; outline: none; }
        h1 { color: var(--primary); margin: 15px 0 5px; font-size: 28px; font-weight: 900; letter-spacing: 1px; }
        .sub-slogan { color: var(--text-sub); font-size: 11px; margin-bottom: 20px; }
        input, select { width: 100%; padding: 12px 14px; margin-bottom: 12px; background: #0b1120; border: 1px solid var(--border); color: #fff; border-radius: 10px; box-sizing: border-box; font-size: 13px; outline: none; }
        input:focus, select:focus { border-color: var(--primary); }
        button { width: 100%; padding: 13px; background: var(--primary-gradient); color: #0b1120; border: none; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 5px; box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3); }
        .toggle-link, .forgot-link { margin-top: 12px; font-size: 12px; color: var(--text-sub); cursor: pointer; }
        .toggle-link span, .forgot-link span { color: var(--primary); font-weight: bold; }
        .age-warning { font-size: 10px; color: var(--error-red); margin-top: -8px; margin-bottom: 10px; text-align: right; }
        html[dir="ltr"] .age-warning { text-align: left; }
        .msg-box { display: none; padding: 10px; border-radius: 8px; font-size: 12px; margin-top: 10px; text-align: center; }
        .msg-error { color: var(--error-red); background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); }
        .msg-success { color: var(--success-green); background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.3); }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="lang-picker-top">
            <select class="lang-select" id="langSelect" onchange="setGlobalLanguage(this.value)">
                <option value="ar">العربية</option>
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="tr">Türkçe</option>
            </select>
        </div>

        <h1>MYGRAM</h1>
        <div class="sub-slogan">Everything you need is here</div>
        
        <!-- حقول التسجيل الإضافية عند الحاجة -->
        <div id="signupFields" style="display:none;">
            <input type="text" id="fullName" placeholder="الاسم الكامل">
            <input type="date" id="birthDate">
            <div class="age-warning">* يجب أن يكون عمرك 16 عاماً أو أكثر للتسجيل.</div>
            
            <select id="genderSelect">
                <option value="" disabled selected>تحديد الجندر (الهوية)</option>
                <option value="male">ذكر (Male)</option>
                <option value="female">أنثى (Female)</option>
            </select>
        </div>

        <!-- خانتان أساسيتان فقط: الحساب (إيميل أو هاتف) + كلمة السر -->
        <input type="text" id="accountInput" placeholder="البريد الإلكتروني أو رقم الهاتف">
        <input type="password" id="passwordInput" placeholder="كلمة السر">
        
        <button id="actionBtn" onclick="handleAuth()">تسجيل الدخول</button>
        
        <div class="msg-box" id="msgBox"></div>

        <div class="forgot-link" id="forgotDiv" onclick="openRecovery()">
            <span>هل نسيت كلمة السر؟ استرداد الحساب</span>
        </div>

        <div class="toggle-link" onclick="toggleMode()">
            <span id="toggleText">ليس لديك حساب؟ انضم إلينا الآن</span>
        </div>
    </div>

    <script>
        let isSignup = false;
        let isRecovery = false;

        function showMsg(text, isErr = true) {
            const box = document.getElementById('msgBox');
            box.innerText = text;
            box.className = 'msg-box ' + (isErr ? 'msg-error' : 'msg-success');
            box.style.display = 'block';
        }

        function setGlobalLanguage(code) {
            localStorage.setItem('mygram_lang', code);
            document.getElementById('htmlRoot').setAttribute('lang', code);
            document.getElementById('htmlRoot').setAttribute('dir', (code === 'ar' || code === 'fa' || code === 'ur') ? 'rtl' : 'ltr');
        }

        function toggleMode() {
            document.getElementById('msgBox').style.display = 'none';
            isSignup = !isSignup;
            isRecovery = false;
            document.getElementById('signupFields').style.display = isSignup ? 'block' : 'none';
            document.getElementById('forgotDiv').style.display = isSignup ? 'none' : 'block';
            document.getElementById('actionBtn').innerText = isSignup ? 'إنشاء حساب جديد' : 'تسجيل الدخول';
            document.getElementById('toggleText').innerText = isSignup ? 'لديك حساب بالفعل؟ سجل دخولك' : 'ليس لديك حساب؟ انضم إلينا الآن';
        }

        function openRecovery() {
            isRecovery = true;
            document.getElementById('signupFields').style.display = 'none';
            document.getElementById('passwordInput').style.display = 'none';
            document.getElementById('actionBtn').innerText = 'إرسال رمز الاسترداد (SMS / Email)';
            document.getElementById('forgotDiv').style.display = 'none';
            document.getElementById('toggleText').innerHTML = '<span>العودة لتسجيل الدخول</span>';
        }

        function handleAuth() {
            const acc = document.getElementById('accountInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();

            if (!acc) {
                showMsg('الرجاء إدخال البريد الإلكتروني أو رقم الهاتف!');
                return;
            }

            if (isRecovery) {
                showMsg('تم إرسال رمز التحقق واسترداد كلمة السر بنجاح إلى: ' + acc, false);
                setTimeout(() => { location.reload(); }, 3000);
                return;
            }

            if (!pass) {
                showMsg('الرجاء إدخال كلمة السر!');
                return;
            }

            let accounts = JSON.parse(localStorage.getItem('mygram_all_accounts') || '[]');
            let userObj = accounts.find(a => a.account === acc);

            if (isSignup) {
                const birthDate = document.getElementById('birthDate').value;
                if (!birthDate) { showMsg('الرجاء إدخال تاريخ الميلاد!'); return; }
                
                // حساب العمر
                const age = new Date().getFullYear() - new Date(birthDate).getFullYear();
                if (age < 16) { showMsg('يجب أن يكون عمرك 16 سنة أو أكثر!'); return; }

                const gender = document.getElementById('genderSelect').value || 'male';
                const fullName = document.getElementById('fullName').value.trim() || acc.split('@')[0];

                userObj = { account: acc, pass: pass, name: fullName, age: age, gender: gender, avatar: '' };
                accounts.push(userObj);
                localStorage.setItem('mygram_all_accounts', JSON.stringify(accounts));
            } else {
                if (!userObj) {
                    // تسجيل دخول لأول مرة بحساب جديد افتراضي أو تخزين مباشر
                    userObj = { account: acc, pass: pass, name: acc.split('@')[0], age: 20, gender: 'male', avatar: '' };
                    accounts.push(userObj);
                    localStorage.setItem('mygram_all_accounts', JSON.stringify(accounts));
                }
            }

            // حفظ الحساب الحالي وحالة تسجيل الدخول الدائمة (Session)
            localStorage.setItem('mygram_current_account', JSON.stringify(userObj));
            localStorage.setItem('mygram_is_logged', 'true');
            window.location.href = 'home.html';
        }

        // التحقق مما إذا كان المستخدم مسجل دخول مسبقاً ليتم تحويله مباشرة دون إعادة إدخال البيانات
        window.onload = function() {
            let savedLang = localStorage.getItem('mygram_lang') || 'ar';
            document.getElementById('langSelect').value = savedLang;
            setGlobalLanguage(savedLang);

            if (localStorage.getItem('mygram_is_logged') === 'true') {
                window.location.href = 'home.html';
            }
        };
    </script>
</body>
</html>
