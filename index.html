<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYGRAM - البوابة العالمية</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-card { background: #1e293b; padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); border: 1px solid #334155; text-align: center; }
        h1 { color: #38bdf8; margin-bottom: 8px; font-size: 26px; }
        p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 12px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; background: linear-gradient(135deg, #38bdf8, #0284c7); color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 5px; }
        button:hover { opacity: 0.9; }
        .toggle-link { margin-top: 15px; font-size: 13px; color: #94a3b8; cursor: pointer; }
        .toggle-link span { color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>

    <div class="auth-card">
        <h1>MYGRAM</h1>
        <p>اتحاد منصات التواصل والذكاء الاصطناعي</p>
        
        <div id="nameField" style="display:none;">
            <input type="text" id="fullName" placeholder="الاسم الكامل">
        </div>
        <input type="text" id="identifier" placeholder="البريد الإلكتروني أو رقم الهاتف">
        <input type="password" id="password" placeholder="كلمة السر">
        
        <button id="actionBtn" onclick="handleAuth()">تسجيل الدخول</button>
        
        <div class="toggle-link" onclick="toggleMode()">
            <span id="toggleText">ليس لديك حساب؟ انضم إلينا الآن</span>
        </div>
    </div>

    <script>
        let isSignup = false;

        function toggleMode() {
            isSignup = !isSignup;
            document.getElementById('nameField').style.display = isSignup ? 'block' : 'none';
            document.getElementById('actionBtn').innerText = isSignup ? 'إنشاء حساب عالمي' : 'تسجيل الدخول';
            document.getElementById('toggleText').innerText = isSignup ? 'لديك حساب بالفعل؟ سجل دخولك' : 'ليس لديك حساب؟ انضم إلينا الآن';
        }

        function handleAuth() {
            const identifier = document.getElementById('identifier').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if (!identifier || !password) {
                alert('الرجاء تعبئة بيانات الدخول!');
                return;
            }

            if (isSignup) {
                const fullName = document.getElementById('fullName').value.trim();
                if (!fullName) {
                    alert('الرجاء إدخال الاسم الكامل!');
                    return;
                }
                localStorage.setItem('mygram_username', fullName);
            } else {
                localStorage.setItem('mygram_username', identifier.split('@')[0]);
            }

            window.location.href = 'home.html';
        }
    </script>
</body>
</html>
