<!doctype html>
<html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="logo.svg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087cf0"><title>MYGRAM | الملف الشخصي</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="config.js"></script><script defer src="auth-guard.js"></script><script defer src="profile.js"></script>
<style>.profile-wrap{max-width:760px;margin:24px auto;padding:0 16px}.profile-card{padding:22px;margin-top:16px}.cover-preview{width:100%;max-height:210px;object-fit:cover;border-radius:14px;margin:10px 0}.avatar-preview{width:100px;height:100px;object-fit:cover;border-radius:50%;border:4px solid white;box-shadow:0 4px 18px #102a4d22}.profile-form label{display:block;font-weight:700;margin:14px 0 6px}.profile-form input,.profile-form textarea{width:100%;padding:12px;border:1px solid #dce5f0;border-radius:12px;font:inherit}.profile-form textarea{min-height:110px;resize:vertical}.profile-form button{border:0;border-radius:11px;padding:11px 16px;cursor:pointer}.profile-form .primary-btn{background:#087cf0;color:white}.profile-form .secondary{background:#edf2f8;color:#334155}.profile-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.field-note{font-size:12px;color:#718096;margin-top:6px}</style><script defer src="language.js"></script>
</head>
<body><header class="topbar" style="padding:0 20px"><a class="brand" href="home.html"><span class="brand-symbol"><img src="logo.svg" alt="MYGRAM" class="brand-icon"></span><span>MY<span class="brand-blue">GRAM</span></span></a><nav><a href="home.html">الرئيسية</a> · <a href="people.html">الأصدقاء</a> · <a href="services.html">الخدمات</a></nav></header>
<main class="profile-wrap"><section class="welcome-banner"><div><span class="eyebrow">YOUR PROFILE</span><h1>ملفك الشخصي</h1><p>عدّل اسمك واسم المستخدم والنبذة والصور. التغييرات تُحفظ في حسابك.</p></div><div class="banner-mark"><img src="logo.svg" alt="MYGRAM" class="brand-icon-large"></div></section>
<section class="card profile-card"><h2>صورة الغلاف</h2><img id="coverPreview" class="cover-preview" alt="معاينة صورة الغلاف" hidden><label for="coverFile">اختيار صورة غلاف</label><input id="coverFile" type="file" accept="image/*"><button id="removeCoverButton" class="secondary" type="button" hidden>إزالة الغلاف</button></section>
<section class="card profile-card"><h2>معلومات الحساب</h2><form id="profileForm" class="profile-form"><div><img id="avatarPreview" class="avatar-preview" alt="معاينة الصورة الشخصية" hidden></div><label for="avatarFile">الصورة الشخصية</label><input id="avatarFile" type="file" accept="image/*"><button id="removeAvatarButton" class="secondary" type="button" hidden>إزالة الصورة</button>
<label for="fullName">الاسم الظاهر</label><input id="fullName" maxlength="80" autocomplete="name" required>
<label for="username">اسم المستخدم</label><input id="username" maxlength="30" pattern="[A-Za-z0-9_]{3,30}" autocomplete="username" required><p id="usernameNotice" class="field-note" aria-live="polite"></p>
<label for="bio">نبذة عنك</label><textarea id="bio" maxlength="500" placeholder="اكتب نبذة قصيرة عنك…"></textarea><div class="profile-actions"><button id="saveProfileButton" class="primary-btn" type="submit">حفظ التغييرات</button><a class="secondary" style="text-decoration:none" href="home.html">العودة للرئيسية</a><button id="logoutButton" class="secondary" type="button">تسجيل الخروج</button></div></form></section></main><div id="toast" class="toast" role="status" aria-live="polite"></div></body></html>
