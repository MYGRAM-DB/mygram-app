<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fb"><title>الملف الشخصي — MYGRAM</title><link rel="stylesheet" href="styles.css"><style>.profile-wrap{max-width:760px;margin:28px auto;padding:0 16px 95px}.profile-form{display:grid;gap:14px}.field{width:100%;padding:13px 14px;border:1px solid #dbe2ef;border-radius:13px;font:inherit;background:white}.profile-form textarea{min-height:100px;resize:vertical}.muted{color:#64748b}.mygram-bottom-nav{position:fixed;z-index:40;bottom:0;left:0;right:0;height:70px;padding:7px 8px;display:flex;align-items:center;justify-content:space-around;background:#fff;border-top:1px solid #e9eaf3}.mygram-bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:54px;color:#85869d;font-size:10px}.mygram-bottom-nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.mygram-bottom-nav a.active{color:#6254e8;font-weight:800}.mygram-bottom-nav .nav-create{background:#6254e8;color:white;border-radius:15px;padding:5px 13px}@media(min-width:681px){.mygram-bottom-nav{display:none}.profile-wrap{padding-bottom:20px}}.avatar-preview-wrap{position:relative;width:max-content;max-width:100%;margin-top:8px}.attachment-remove{position:absolute;top:5px;right:5px;width:32px;height:32px;border:0;border-radius:50%;background:#e11d48;color:#fff;font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px #0003;cursor:pointer}.avatar-remove{top:2px;right:2px}.avatar-remove[hidden]{display:none}</style></head><body><header class="topbar"><a class="brand" href="home.html">MYGRAM</a><nav style="display:flex;align-items:center;gap:10px"><a class="button button-secondary" href="people.html">الأصدقاء</a><div class="account-menu-wrap"><button class="account-menu-toggle" id="accountMenuToggle" type="button" aria-label="قائمة الحساب" aria-expanded="false">م</button><div class="account-popover" id="accountPopover"><a href="profile.html">الملف الشخصي</a><a href="people.html">الأصدقاء</a><a href="profile.html#settings">الإعدادات والخصوصية</a><button class="logout-item" id="logoutButton" type="button">تسجيل الخروج</button></div></div></nav></header><main class="profile-wrap"><section class="panel" id="profile" style="padding:22px"><h1 style="margin-top:0">الملف الشخصي</h1><p class="muted">عدّل بياناتك وارفع صورتك مباشرةً من جهازك.</p><form id="profileForm" class="profile-form"><label>الاسم الظاهر<input class="field" id="fullName" maxlength="80" required></label><label>اسم المستخدم<input class="field" id="username" maxlength="30" pattern="[A-Za-z0-9_]{3,30}" required><small class="muted">من 3 إلى 30 حرفاً إنجليزياً أو رقماً أو _</small><div id="usernameNotice" class="muted" aria-live="polite"></div></label><label>نبذة عنك<textarea class="field" id="bio" maxlength="240" placeholder="اكتب شيئاً بسيطاً عن نفسك..."></textarea></label><div class="avatar-upload"><label for="avatarFile"><strong>الصورة الشخصية</strong><span class="muted">اختر صورة من المعرض أو الملفات أو التقط صورة بالكاميرا.</span></label><input class="field" id="avatarFile" type="file" accept="image/*"><div class="avatar-preview-wrap" id="avatarPreviewWrap"><img id="avatarPreview" alt="معاينة الصورة الشخصية" hidden style="width:112px;height:112px;object-fit:cover;border-radius:50%;border:3px solid #e5e7eb"><button class="attachment-remove avatar-remove" id="removeAvatarButton" type="button" aria-label="إزالة الصورة المختارة" title="إزالة الصورة">×</button></div></div><button class="button" type="submit" id="saveProfileButton">حفظ الملف الشخصي</button></form><div id="settings" style="margin-top:28px"><h2>الإعدادات والخصوصية</h2><p class="muted">خيارات إضافية ستتوفر في مراحل لاحقة.</p></div></section><div id="toast" class="toast" role="status" aria-live="polite"></div></main><nav class="mygram-bottom-nav" aria-label="التنقل الرئيسي"><a href="home.html"><svg viewBox="0 0 24 24"><path d="M3 10.8 12 3l9 7.8M5.5 9.5V21h13V9.5"/></svg><small>الرئيسية</small></a><a href="people.html"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20v-1.3a6.5 6.5 0 0 1 13 0V20"/></svg><small>الأصدقاء</small></a><a class="nav-create" href="home.html#composer"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg><small>نشر</small></a><a href="home.html#feed"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8"/></svg><small>المنشورات</small></a><a class="active" href="profile.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg><small>الملف الشخصي</small></a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="account-menu.js"></script><script src="profile.js"></script></body></html>
