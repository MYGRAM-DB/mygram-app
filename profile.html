<!doctype html>
<html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="logo.svg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087cf0"><title>MYGRAM | الملف الشخصي</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="config.js"></script><script defer src="country-data.js"></script><script defer src="language.js"></script><script defer src="auth-guard.js"></script><script defer src="profile.js"></script>
<style>.profile-wrap{max-width:760px;margin:24px auto;padding:0 16px}.profile-card{padding:22px;margin-top:16px}.cover-preview{width:100%;max-height:210px;object-fit:cover;border-radius:14px;margin:10px 0}.avatar-preview{width:100px;height:100px;object-fit:cover;border-radius:50%;border:4px solid white;box-shadow:0 4px 18px #102a4d22}.profile-form label{display:block;font-weight:700;margin:14px 0 6px}.profile-form input,.profile-form textarea{width:100%;padding:12px;border:1px solid #dce5f0;border-radius:12px;font:inherit}.profile-form textarea{min-height:110px;resize:vertical}.profile-form select{width:100%;padding:12px;border:1px solid #dce5f0;border-radius:12px;background:white;font:inherit}.discovery-settings{margin-top:24px;padding:18px;border:1px solid #e3ebf6;border-radius:16px;background:#f8fbff}.discovery-settings h3{margin:0 0 6px}.discovery-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.discovery-consent{display:flex!important;flex-direction:row;align-items:flex-start;gap:10px!important;line-height:1.8}.discovery-consent input{width:auto!important;margin-top:6px}@media(max-width:520px){.discovery-grid{grid-template-columns:1fr}}.profile-form button{border:0;border-radius:11px;padding:11px 16px;cursor:pointer}.profile-form .primary-btn{background:#087cf0;color:white}.profile-form .secondary{background:#edf2f8;color:#334155}.profile-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.field-note{font-size:12px;color:#718096;margin-top:6px}</style>
</head>
<body><header class="topbar" style="padding:0 20px"><a class="brand" href="home.html"><span class="brand-symbol"><img src="logo.svg" alt="MYGRAM" class="brand-icon"></span><span>MY<span class="brand-blue">GRAM</span></span></a><nav><a href="home.html">الرئيسية</a> · <a href="people.html">الأصدقاء</a> · <a href="services.html">الخدمات</a></nav></header>
<main class="profile-wrap"><section class="welcome-banner"><div><span class="eyebrow">YOUR PROFILE</span><h1>ملفك الشخصي</h1><p>عدّل اسمك واسم المستخدم والنبذة والصور. التغييرات تُحفظ في حسابك.</p></div><div class="banner-mark"><img src="logo.svg" alt="MYGRAM" class="brand-icon-large"></div></section>
<section class="card profile-card"><h2>صورة الغلاف</h2><img id="coverPreview" class="cover-preview" alt="معاينة صورة الغلاف" hidden><label for="coverFile">اختيار صورة غلاف</label><input id="coverFile" type="file" accept="image/*"><button id="removeCoverButton" class="secondary" type="button" hidden>إزالة الغلاف</button></section>
<section class="card profile-card"><h2>معلومات الحساب</h2><form id="profileForm" class="profile-form"><div><img id="avatarPreview" class="avatar-preview" alt="معاينة الصورة الشخصية" hidden></div><label for="avatarFile">الصورة الشخصية</label><input id="avatarFile" type="file" accept="image/*"><button id="removeAvatarButton" class="secondary" type="button" hidden>إزالة الصورة</button>
<label for="fullName">الاسم الظاهر</label><input id="fullName" maxlength="80" autocomplete="name" required>
<label for="username">اسم المستخدم</label><input id="username" maxlength="30" pattern="[A-Za-z0-9_]{3,30}" autocomplete="username" required><p id="usernameNotice" class="field-note" aria-live="polite"></p>
<label for="bio">نبذة عنك</label><textarea id="bio" maxlength="500" placeholder="اكتب نبذة قصيرة عنك…"></textarea>
<div class="discovery-settings">
<h3>🌍 اللغة والموقع والاهتمامات</h3>
<p class="field-note">هذه المعلومات اختيارية. استخدمها لتخصيص الاقتراحات، ويمكنك إيقاف الظهور في الاكتشاف بأي وقت.</p>
<label for="preferredLanguage">لغة الواجهة المفضلة</label><select id="preferredLanguage"><option value="ar">العربية</option><option value="en">English</option><option value="fr">Français</option><option value="es">Español</option><option value="pt">Português</option><option value="de">Deutsch</option><option value="it">Italiano</option><option value="tr">Türkçe</option><option value="zh">中文</option><option value="ja">日本語</option><option value="ru">Русский</option><option value="hi">हिन्दी</option><option value="id">Bahasa Indonesia</option><option value="nl">Nederlands</option><option value="ko">한국어</option><option value="vi">Tiếng Việt</option><option value="pl">Polski</option><option value="bn">বাংলা</option><option value="ur">اردو</option><option value="th">ไทย</option><option value="sw">Kiswahili</option><option value="el">Ελληνικά</option><option value="sv">Svenska</option><option value="no">Norsk</option><option value="da">Dansk</option><option value="fi">Suomi</option><option value="fil">Filipino</option><option value="ms">Bahasa Melayu</option><option value="uk">Українська</option><option value="cs">Čeština</option><option value="ro">Română</option><option value="fa">فارسی</option><option value="he">עברית</option><option value="bg">Български</option><option value="hr">Hrvatski</option><option value="sr">Српски</option><option value="sk">Slovenčina</option><option value="sl">Slovenščina</option><option value="lt">Lietuvių</option><option value="lv">Latviešu</option><option value="et">Eesti</option><option value="hu">Magyar</option><option value="ca">Català</option><option value="eu">Euskara</option><option value="gl">Galego</option><option value="is">Íslenska</option><option value="mk">Македонски</option><option value="sq">Shqip</option><option value="bs">Bosanski</option><option value="ka">ქართული</option><option value="hy">Հայերեն</option><option value="az">Azərbaycanca</option><option value="ga">Gaeilge</option><option value="cy">Cymraeg</option><option value="ne">नेपाली</option><option value="ta">தமிழ்</option><option value="te">తెలుగు</option><option value="mr">मराठी</option><option value="am">አማርኛ</option><option value="si">සිංහල</option></select>
<label class="discovery-consent"><input id="autoDetectLanguage" type="checkbox" checked> اكتشاف لغة الواجهة تلقائياً من إعدادات المتصفح</label>
<label class="discovery-consent"><input id="autoDetectRegion" type="checkbox" checked> اكتشاف المنطقة تلقائياً من إعدادات اللغة في المتصفح (من دون GPS دقيق)</label>
<div class="discovery-grid">
<div><label for="countryCode">بلد الإقامة</label><select id="countryCode"><option value="">اختر البلد</option></select></div>
<div><label for="nationalityCode">الجنسية</label><select id="nationalityCode"><option value="">اختر الجنسية</option></select></div>
<div><label for="region">المنطقة / الولاية</label><input id="region" maxlength="100" autocomplete="address-level1"></div>
<div><label for="city">المدينة</label><input id="city" maxlength="100" autocomplete="address-level2"></div>
</div>
<label for="interests">اهتماماتك (افصل بينها بفواصل)</label><input id="interests" maxlength="600" placeholder="التقنية، الرياضة، الموسيقى، السفر">
<label class="discovery-consent"><input id="discoveryEnabled" type="checkbox"> اسمح باستخدام البلد والمدينة والاهتمامات لاقتراح أصدقاء ومحتوى مناسب. لن نطلب موقع GPS الدقيق.</label>
</div><div class="profile-actions"><button id="saveProfileButton" class="primary-btn" type="submit">حفظ التغييرات</button><a class="secondary" style="text-decoration:none" href="home.html">العودة للرئيسية</a><button id="logoutButton" class="secondary" type="button">تسجيل الخروج</button></div></form></section></main><div id="toast" class="toast" role="status" aria-live="polite"></div></body></html>
