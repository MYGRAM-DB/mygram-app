<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f7fb"><title>الأعضاء والأصدقاء — MYGRAM</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .people-topnav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .people-topnav a{display:inline-flex;align-items:center;gap:7px}
    .people-topnav svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .people-wrap{padding-bottom:90px}
    .mygram-bottom-nav{position:fixed;z-index:40;bottom:0;left:0;right:0;height:70px;padding:7px 8px;display:flex;align-items:center;justify-content:space-around;background:#fff;border-top:1px solid #e9eaf3;box-shadow:0 -8px 24px #25254a0a}
    .mygram-bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:54px;color:#85869d;font-size:10px}
    .mygram-bottom-nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .mygram-bottom-nav a.active{color:#6254e8;font-weight:800}
    .mygram-bottom-nav .nav-create{background:#6254e8;color:white;border-radius:15px;padding:5px 13px;min-width:48px}
    @media(min-width:681px){.mygram-bottom-nav{display:none}.people-wrap{padding-bottom:20px}}
    .people-wrap{max-width:980px;margin:28px auto;padding:0 16px}
    .people-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
    .member-card{padding:18px;display:flex;gap:13px;align-items:flex-start}
    .member-card .user-avatar{flex:0 0 48px;width:48px;height:48px;display:grid;place-items:center;border-radius:50%;overflow:hidden;background:#e6edff;color:#2446a8;font-weight:800}
    .member-card img{width:100%;height:100%;object-fit:cover}
    .member-details{min-width:0;flex:1}.member-details strong{display:block;overflow-wrap:anywhere}
    .member-details p{margin:6px 0;color:var(--muted,#64748b);font-size:.92rem;overflow-wrap:anywhere}
    .member-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .field{width:100%;padding:13px 14px;border:1px solid #dbe2ef;border-radius:13px;font:inherit;background:white}
    .section-title{margin:24px 0 12px}.muted{color:#64748b}.notice{padding:12px 14px;margin:12px 0;border-radius:12px;background:#eef4ff}
    .button-secondary{background:#eef2ff;color:#273c9b;border:1px solid #dbe4ff}
    .profile-form{display:grid;gap:12px}.profile-form textarea{min-height:90px;resize:vertical}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="home.html" aria-label="MYGRAM الرئيسية">MYGRAM</a>
    <nav class="people-topnav">
      <a class="button button-secondary" href="home.html"><svg viewBox="0 0 24 24"><path d="M3 10.8 12 3l9 7.8M5.5 9.5V21h13V9.5"/></svg>الرئيسية</a>
      <a class="button button-secondary" href="people.html"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20v-1.3a6.5 6.5 0 0 1 13 0V20M16 5a3.5 3.5 0 0 1 0 6.8"/></svg>الأصدقاء</a>
      <button class="button button-secondary" id="logoutButton" type="button">تسجيل الخروج</button>
    </nav>
  </header>
  <main class="people-wrap">
    <section class="panel" id="profile" style="padding:20px">
      <h1 style="margin-top:0">الملف الشخصي والأصدقاء</h1>
      <p class="muted">حدّث ملفك الشخصي وابحث عن أعضاء MYGRAM وأرسل طلبات الصداقة.</p>
      <form id="profileForm" class="profile-form">
        <label>الاسم الظاهر<input class="field" id="fullName" maxlength="80" required></label>
        <label>اسم المستخدم<input class="field" id="username" maxlength="30" pattern="[A-Za-z0-9_]{3,30}" required><small class="muted">من 3 إلى 30 حرفاً إنجليزياً أو رقماً أو _</small></label>
        <label>نبذة عنك<textarea class="field" id="bio" maxlength="240" placeholder="اكتب شيئاً بسيطاً عن نفسك..."></textarea></label>
        <label>رابط صورة شخصية (اختياري)<input class="field" id="avatarUrl" type="url" placeholder="https://..."></label>
        <button class="button" type="submit" id="saveProfileButton">حفظ الملف الشخصي</button>
      </form>
    </section>
    <section>
      <h2 class="section-title">البحث عن الأعضاء</h2>
      <input id="searchInput" class="field" type="search" placeholder="ابحث بالاسم أو @اسم المستخدم">
      <div id="searchNotice" class="notice" hidden></div>
      <div id="membersList" class="people-grid" style="margin-top:14px"></div>
    </section>
    <section>
      <h2 class="section-title">طلبات الصداقة الواردة</h2>
      <div id="incomingList" class="people-grid"></div>
    </section>
    <section>
      <h2 class="section-title">طلبات أرسلتها</h2>
      <div id="outgoingList" class="people-grid"></div>
    </section>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
  <nav class="mygram-bottom-nav" aria-label="التنقل الرئيسي">
    <a href="home.html"><svg viewBox="0 0 24 24"><path d="M3 10.8 12 3l9 7.8M5.5 9.5V21h13V9.5M9.5 21v-7h5v7"/></svg><small>الرئيسية</small></a>
    <a class="active" href="people.html"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20v-1.3a6.5 6.5 0 0 1 13 0V20M16 5a3.5 3.5 0 0 1 0 6.8M18 14a5 5 0 0 1 3.5 4.8V20"/></svg><small>الأصدقاء</small></a>
    <a class="nav-create" href="home.html#composer"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg><small>نشر</small></a>
    <a href="home.html#feed"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><small>المنشورات</small></a>
    <a href="#profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg><small>الملف الشخصي</small></a>
  </nav>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script><script src="people.js"></script>
</body></html>
