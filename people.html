<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f7fb"><title>الأعضاء والأصدقاء — MYGRAM</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .people-wrap{max-width:980px;margin:28px auto;padding:0 16px}
    .people-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
    .member-card{padding:18px;display:flex;gap:13px;align-items:flex-start}
    .member-card .user-avatar{flex:0 0 48px;width:48px;height:48px;display:grid;place-items:center;border-radius:50%;overflow:hidden;background:#e6edff;color:#2446a8;font-weight:800}
    .member-card img{width:100%;height:100%;object-fit:cover}
    .member-details{min-width:0;flex:1}.member-details strong{display:block;overflow-wrap:anywhere}
    .member-details p{margin:6px 0;color:var(--muted,#64748b);font-size:.92rem;overflow-wrap:anywhere}
    .member-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .field{width:100%;padding:13px 14px;border:1px solid #dbe2ef;border-radius:13px;font:inherit;background:white}
    .section-title{margin:24px 0 12px}.muted{color:#64748b}.notice{padding:12px 14px;margin:12px 0;border-radius:12px;background:#eef4ff}
    .button-secondary{background:#eef2ff;color:#273c9b;border:1px solid #dbe4ff}
    .profile-form{display:grid;gap:12px}.profile-form textarea{min-height:90px;resize:vertical}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="home.html" aria-label="MYGRAM الرئيسية">MYGRAM</a>
    <nav class="top-actions">
      <a class="button button-secondary" href="home.html">الرئيسية</a>
      <button class="button button-secondary" id="logoutButton" type="button">تسجيل الخروج</button>
    </nav>
  </header>
  <main class="people-wrap">
    <section class="panel" style="padding:20px">
      <h1 style="margin-top:0">الأعضاء والأصدقاء 🤝</h1>
      <p class="muted">حدّث ملفك الشخصي وابحث عن أعضاء MYGRAM وأرسل طلبات الصداقة.</p>
      <form id="profileForm" class="profile-form">
        <label>الاسم الظاهر<input class="field" id="fullName" maxlength="80" required></label>
        <label>اسم المستخدم<input class="field" id="username" maxlength="30" pattern="[A-Za-z0-9_]{3,30}" required><small class="muted">من 3 إلى 30 حرفاً إنجليزياً أو رقماً أو _</small></label>
        <label>نبذة عنك<textarea class="field" id="bio" maxlength="240" placeholder="اكتب شيئاً بسيطاً عن نفسك..."></textarea></label>
        <label>رابط صورة شخصية (اختياري)<input class="field" id="avatarUrl" type="url" placeholder="https://..."></label>
        <button class="button" type="submit" id="saveProfileButton">حفظ الملف الشخصي</button>
      </form>
    </section>
    <section>
      <h2 class="section-title">البحث عن الأعضاء</h2>
      <input id="searchInput" class="field" type="search" placeholder="ابحث بالاسم أو @اسم المستخدم">
      <div id="searchNotice" class="notice" hidden></div>
      <div id="membersList" class="people-grid" style="margin-top:14px"></div>
    </section>
    <section>
      <h2 class="section-title">طلبات الصداقة الواردة</h2>
      <div id="incomingList" class="people-grid"></div>
    </section>
    <section>
      <h2 class="section-title">طلبات أرسلتها</h2>
      <div id="outgoingList" class="people-grid"></div>
    </section>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script><script src="people.js"></script>
</body></html>
