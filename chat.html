<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#087cf0"><title>MYGRAM Chat | المحادثات</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="config.js"></script><script defer src="auth-guard.js"></script><script defer src="language.js"></script><script defer src="chat.js"></script>
<style>
.chat-shell{max-width:1100px;margin:24px auto;padding:0 14px}.chat-layout{display:grid;grid-template-columns:minmax(230px,320px) minmax(0,1fr);gap:14px}.chat-panel{padding:16px;min-width:0}.chat-list{display:grid;gap:8px;max-height:65vh;overflow:auto}.chat-entry{display:block;width:100%;text-align:start;background:transparent;color:inherit;border:1px solid #e2e8f0;border-radius:12px;padding:12px;cursor:pointer}.chat-entry[aria-current=true]{border-color:#087cf0;background:#eff6ff}.chat-thread{display:flex;flex-direction:column;min-height:65vh}.chat-messages{flex:1;max-height:58vh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:8px}.chat-bubble{max-width:min(88%,560px);padding:10px 12px;border-radius:14px;background:#f1f5f9;align-self:flex-start;overflow-wrap:anywhere}.chat-bubble.mine{align-self:flex-end;background:#dbeafe}.chat-bubble img,.chat-bubble video{display:block;max-width:100%;max-height:260px;border-radius:10px}.chat-bubble audio{max-width:100%}.chat-compose{display:grid;gap:8px;margin-top:12px}.chat-compose textarea{min-height:72px}.chat-compose input,.chat-compose textarea,.chat-new input{width:100%;padding:11px;border:1px solid #dce5f0;border-radius:10px;font:inherit}.chat-new{display:flex;gap:8px;margin:10px 0}.chat-new input{min-width:0;flex:1}.chat-subtitle{color:#718096;font-size:13px}.chat-thread-head{padding:10px;border-bottom:1px solid #e5e7eb}.chat-empty{padding:24px;text-align:center;color:#64748b}@media(max-width:700px){.chat-layout{grid-template-columns:1fr}.chat-thread{min-height:50vh}.chat-messages{max-height:45vh}.chat-list{max-height:32vh}}
.call-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:10px;border-bottom:1px solid #e5e7eb}.call-toolbar [hidden],.call-media[hidden]{display:none!important}.call-toolbar #callStatus{font-size:13px;color:#52637a}.call-media{display:flex;gap:10px;flex-wrap:wrap;padding:10px}.call-media video{width:min(48%,360px);min-width:180px;max-height:260px;object-fit:cover;background:#0f172a;border-radius:12px}.call-media audio{display:none}
/* MYGRAM Messenger: dark-first, two-pane layout with a mobile-first fallback. */
body.chat-page{min-height:100vh;background:#0b1220;color:#e6edf7;color-scheme:dark}
.chat-page .topbar{background:#101a2b;border-bottom:1px solid #26364d;color:#e6edf7}
.chat-page .topbar a,.chat-page .topbar nav{color:#c5d3e7}
.chat-page .chat-shell{max-width:1320px;margin:18px auto;padding:0 18px}
.chat-page .chat-layout{display:grid;grid-template-columns:minmax(270px,340px) minmax(0,1fr);gap:16px;align-items:stretch}
.chat-page .chat-panel{background:#111c2e;border:1px solid #26364d;border-radius:18px;box-shadow:0 16px 40px #00000024;color:#e6edf7}
.chat-page .chat-sidebar{display:flex;flex-direction:column;min-height:72vh}
.chat-page .chat-sidebar h1{font-size:21px;margin:4px 0 6px}
.chat-page .chat-list{max-height:calc(72vh - 140px);gap:7px}
.chat-page .chat-entry{border-color:#2b3c55;background:#142238;color:#e6edf7;transition:background .15s,border-color .15s}
.chat-page .chat-entry:hover,.chat-page .chat-entry[aria-current=true]{background:#193454;border-color:#4b9cff}
.chat-page .chat-subtitle{color:#9db0ca}
.chat-page .chat-thread-panel{display:flex;flex-direction:column;min-width:0;min-height:72vh}
.chat-page .chat-thread-head{border-color:#293a52;color:#f1f6ff;font-weight:750}
.chat-page .call-toolbar{border-color:#293a52}
.chat-page .call-toolbar #callStatus,.chat-page .chat-compose label{color:#a9bad2}
.chat-page .chat-messages{max-height:none;min-height:300px;max-height:calc(72vh - 230px);padding:14px}
.chat-page .chat-bubble{background:#1b2a40;color:#edf4ff;border:1px solid #2b3d56}
.chat-page .chat-bubble.mine{background:#123b65;border-color:#245c91;color:#f5f9ff}
.chat-page .chat-empty{color:#9fb1ca}
.chat-page .chat-compose input,.chat-page .chat-compose textarea,.chat-page .chat-new input{background:#0c1626;border:1px solid #2d405a;color:#edf4ff}
.chat-page .chat-compose input:focus,.chat-page .chat-compose textarea:focus,.chat-page .chat-new input:focus{outline:2px solid #3288e8;outline-offset:1px}
.chat-page .chat-compose input::placeholder,.chat-page .chat-compose textarea::placeholder,.chat-page .chat-new input::placeholder{color:#8296b3}
.chat-page .button{border:1px solid #344b68;color:#e7f0ff;background:#1a2b43}
.chat-page .button.primary{background:#1677e8;border-color:#1677e8;color:#fff}
.chat-page .button:disabled{opacity:.55;cursor:not-allowed}
.chat-page .call-media video{border:1px solid #34465f}
.chat-page .chat-toast{z-index:80}
@media(max-width:760px){
 .chat-page .chat-shell{padding:0 10px 20px;margin:10px auto}
 .chat-page .chat-layout{grid-template-columns:minmax(0,1fr);gap:12px}
 .chat-page .chat-sidebar{min-height:0}
 .chat-page .chat-list{max-height:220px}
 .chat-page .chat-thread-panel{min-height:58vh}
 .chat-page .chat-messages{min-height:220px;max-height:42vh;padding:8px}
 .chat-page .call-media video{width:100%;min-width:0;max-width:100%}
 .chat-page .chat-new{gap:6px}
 .chat-page .chat-new button{white-space:nowrap}
}
@media(prefers-reduced-motion:reduce){.chat-page *{transition:none!important;scroll-behavior:auto!important}}
</style>
  <script defer src="notifications.js"></script>
</head>
<body class="chat-page">
<header class="topbar"><div class="topbar-inner"><a class="brand" href="home.html">MYGRAM</a><nav><a href="home.html">الرئيسية</a> · <a href="services.html">Messenger</a> · <strong>Chat</strong></nav></div></header>
<main class="chat-shell">
<div class="chat-layout">
<section class="card chat-panel chat-sidebar">
<h1>💬 MYGRAM Chat</h1><p class="chat-subtitle">مساحة محادثات منفصلة عن الرسائل المباشرة في Messenger.</p>
<form id="newChatForm" class="chat-new"><input id="chatUsername" autocomplete="off" placeholder="اسم مستخدم أو عدة أسماء مفصولة بفواصل" minlength="3" maxlength="30" required><button class="button primary" type="submit">محادثة جديدة</button></form>
<div id="chatList" class="chat-list" aria-label="قائمة المحادثات"></div>
</section>
<section class="card chat-panel chat-thread-panel">
<div id="threadHead" class="chat-thread-head">اختر محادثة من القائمة أو ابدأ محادثة جديدة.</div>
<div class="call-toolbar" aria-label="Audio and video calling">
<button id="audioCallButton" class="button" type="button">📞 بدء مكالمة صوتية</button>
<button id="videoCallButton" class="button" type="button">🎥 بدء مكالمة فيديو</button>
<button id="acceptCallButton" class="button primary" type="button" hidden>قبول المكالمة</button>
<button id="rejectCallButton" class="button" type="button" hidden>رفض</button>
<button id="endCallButton" class="button" type="button" hidden>إنهاء المكالمة</button>
<span id="callStatus" role="status" aria-live="polite"></span>
</div>
<div id="callMedia" class="call-media" hidden>
<video id="localCallVideo" autoplay muted playsinline aria-label="Your camera"></video>
<video id="remoteCallVideo" autoplay playsinline aria-label="Remote participant camera"></video>
<audio id="remoteCallAudio" autoplay></audio>
</div>
<div class="chat-thread"><div id="chatMessages" class="chat-messages" aria-live="polite"><div class="chat-empty">محادثاتك ستظهر هنا.</div></div>
<form id="chatCompose" class="chat-compose"><label for="chatBody">رسالتك</label><textarea id="chatBody" maxlength="10000" placeholder="اكتب رسالة..." ></textarea><label for="chatFile">إرفاق صورة أو فيديو أو صوت</label><input id="chatFile" type="file" accept="image/*,video/*,audio/*"><div class="voice-actions"><button id="recordVoiceButton" class="button" type="button" aria-pressed="false">🎙️ تسجيل رسالة صوتية</button><span id="voiceRecordingStatus" role="status" aria-live="polite"></span></div><button class="button primary" type="submit">إرسال</button></form></div>
</section>
</div>
<div id="chatToast" role="status" aria-live="polite" class="toast"></div>
</main>
</body></html>
