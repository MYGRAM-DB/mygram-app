<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYGRAM</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #0f172a; 
            color: #ffffff; 
            text-align: center; 
            padding-top: 50px; 
            margin: 0;
        }
        h1 { color: #38bdf8; }
        .box { 
            background: #1e293b; 
            margin: 20px auto; 
            padding: 20px; 
            width: 80%; 
            max-width: 400px; 
            border-radius: 10px; 
        }
        a { 
            color: #f87171; 
            text-decoration: none; 
            font-weight: bold; 
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>أهلاً بك في MYGRAM</h1>
        <p id="welcomeUser">جاري تحميل بيانات المستخدم...</p>
        <br>
        <a href="index.html">تسجيل الخروج</a>
    </div>

    <script>
        // قراءة اسم المستخدم بأمان تام وبدون أي عقد
        try {
            const username = localStorage.getItem('mygram_username') || 'زائر';
            document.getElementById('welcomeUser').innerText = "مرحباً بك، " + username + "!";
        } catch (e) {
            document.getElementById('welcomeUser').innerText = "مرحباً بك في التطبيق!";
        }
    </script>

</body>
</html>
