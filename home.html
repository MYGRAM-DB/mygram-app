<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYGRAM - الرئيسية</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #fff; margin: 0; padding-bottom: 70px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px 20px; border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 100; }
        h2 { color: #38bdf8; margin: 0; font-size: 20px; }
        .btn-logout { background: #f87171; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
        
        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }
        
        .post-box, .card-box { background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
        .post-box textarea { width: 100%; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 8px; padding: 10px; resize: none; box-sizing: border-box; height: 80px; font-family: sans-serif; }
        .post-box button { background: #38bdf8; color: #0f172a; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; float: left; }
        
        .post-card { background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #334155; }
        .post-author { font-weight: bold; color: #38bdf8; margin-bottom: 8px; }
        .post-text { color: #e2e8f0; font-size: 15px; line-height: 1.5; }

        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #1e293b; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #334155; z-index: 100; }
        .nav-item { color: #94a3b8; text-decoration: none; font-size: 12px; text-align: center; cursor: pointer; }
        .nav-item.active { color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h2 id="appTitle">MYGRAM</h2>
        <button class="btn-logout" onclick="logout()">خروج</button>
    </div>

    <div class="container" id="mainContent">
        <div class="post-box">
            <textarea id="postText" placeholder="بماذا تفكر يا غالي؟"></textarea>
            <button onclick="addPost()">نشر</button>
            <div style="clear: both;"></div>
        </div>
        <div id="postsContainer"></div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" onclick="switchTab('home', this)">🏠 الرئيسية</div>
        <div class="nav-item" onclick="switchTab('friends', this)">👥 الأصدقاء</div>
        <div class="nav-item" onclick="switchTab('profile', this)">⚙️ حسابي</div>
    </div>

    <script>
        let currentUser = localStorage.getItem('mygram_username') || 'مستخدم مجهول';

        function addPost() {
            const text = document.getElementById('postText').value;
            if (!text.trim()) return;

            let posts = JSON.parse(localStorage.getItem('mygram_posts') || '[]');
            posts.unshift({ author: currentUser, content: text });
            localStorage.setItem('mygram_posts', JSON.stringify(posts));

            document.getElementById('postText').value = '';
            loadPosts();
        }

        function loadPosts() {
            let posts = JSON.parse(localStorage.getItem('mygram_posts') || '[]');
            const container = document.getElementById('postsContainer');
            if(!container) return;
            
            let html = `
                <div class="post-card">
                    <div class="post-author">النظام</div>
                    <div class="post-text">أهلاً بك يا ${currentUser} في منصة MYGRAM! التطبيق يعمل الآن بكامل قوة وسلاسة.</div>
                </div>
            `;

            posts.forEach(p => {
                html += `
                    <div class="post-card">
                        <div class="post-author">${p.author}</div>
                        <div class="post-text">${p.content}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function switchTab(tab, element) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');

            const content = document.getElementById('mainContent');
            if (tab === 'home') {
                document.getElementById('appTitle').innerText = 'MYGRAM';
                content.innerHTML = `
                    <div class="post-box">
                        <textarea id="postText" placeholder="بماذا تفكر يا غالي؟"></textarea>
                        <button onclick="addPost()">نشر</button>
                        <div style="clear: both;"></div>
                    </div>
                    <div id="postsContainer"></div>
                `;
                loadPosts();
            } else if (tab === 'friends') {
                document.getElementById('appTitle').innerText = 'الأصدقاء';
                content.innerHTML = `
                    <div class="card-box">
                        <div class="post-author">قائمة الأصدقاء</div>
                        <div class="post-text">قريباً جداً سيتم إضافة مبحث الأصدقاء والمراسلة الفورية هنا.</div>
                    </div>
                `;
            } else if (tab === 'profile') {
                document.getElementById('appTitle').innerText = 'الملف الشخصي';
                content.innerHTML = `
                    <div class="card-box" style="text-align: center;">
                        <div class="post-author" style="font-size: 18px; margin-bottom: 5px;">👤 ${currentUser}</div>
                        <div class="post-text">أنت مسجل الدخول بنجاح وتستمتع بتطبيق MYGRAM.</div>
                    </div>
                `;
            }
        }

        window.onload = function() {
            loadPosts();
        };

        function logout() {
            localStorage.removeItem('mygram_username');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
