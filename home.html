<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYGRAM - الرئيسية</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px 20px; border-radius: 10px; }
        .content { margin-top: 30px; background: #1e293b; padding: 25px; border-radius: 10px; text-align: center; }
        h2 { color: #38bdf8; margin: 0; }
        .welcome-box { font-size: 20px; color: #4ade80; margin-bottom: 15px; font-weight: bold; }
        p { color: #94a3b8; }
        .btn-logout { background: #f87171; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-logout:hover { background: #ef4444; }
    </style>
</head>
<body>
    <div class="header">
        <h2>MYGRAM</h2>
        <button class="btn-logout" onclick="logout()">تسجيل الخروج</button>
    </div>

    <div class="content">
        <div class="welcome-box" id="welcomeMsg">أهلاً بك!</div>
        <p>تم استيراد ملفك الشخصي وإعداد واجهتك بنجاح دون الحاجة لإعادة الإعداد.</p>
    </div>

    <script>
        // قراءة اسم المستخدم المحفوظ وتجميله بالواجهة تلقائياً
        window.onload = function() {
            const savedUsername = localStorage.getItem('mygram_username');
            const welcomeMsg = document.getElementById('welcomeMsg');
            
            if (savedUsername) {
                welcomeMsg.innerText = `أهلاً بك، ${savedUsername}!`;
            }
        };

        function logout() {
            localStorage.removeItem('mygram_username');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
