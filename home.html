<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYGRAM - الرئيسية</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px 20px; border-radius: 10px; }
        .content { margin-top: 30px; background: #1e293b; padding: 25px; border-radius: 10px; text-align: center; }
        h2 { color: #38bdf8; }
        .btn-logout { background: #f87171; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h2>MYGRAM</h2>
        <button class="btn-logout" onclick="logout()">تسجيل الخروج</button>
    </div>

    <div class="content">
        <h3>أهلاً بك في الواجهة الرئيسية لتطبيقك!</h3>
        <p>تم تسجيل دخولك بنجاح وجاهز لاستعراض محتواك هنا.</p>
    </div>

    <script>
        function logout() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
