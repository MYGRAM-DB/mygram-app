<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYGRAM - التواصل الاجتماعي</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #fff;
            --border-color: #334155;
            --primary-color: #38bdf8;
            --secondary-text: #94a3b8;
        }
        .light-mode {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --border-color: #cbd5e1;
            --primary-color: #0284c7;
            --secondary-text: #64748b;
        }

        body { font-family: sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding-bottom: 70px; transition: 0.3s; }
        .header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 15px 20px; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
        h2 { color: var(--primary-color); margin: 0; font-size: 20px; }
        .header-btns { display: flex; gap: 8px; }
        .btn-theme, .btn-logout { border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .btn-theme { background: #475569; color: #fff; }
        .btn-logout { background: #f87171; color: #fff; }
        
        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }
        
        .post-box, .card-box, .post-card, .ad-card { background: var(--card-bg); padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .post-box textarea { width: 100%; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 8px; padding: 10px; resize: none; box-sizing: border-box; height: 80px; font-family: sans-serif; }
        .post-box button, .action-btn, .add-btn { background: var(--primary-color); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .post-box button { float: left; }
        
        .post-author { font-weight: bold; color: var(--primary-color); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .post-text { color: var(--text-color); font-size: 15px; line-height: 1.5; margin-bottom: 10px; }
        
        /* تنسيق الإعلان المميز */
        .ad-card { border: 2px dashed #f59e0b; background: rgba(245, 158, 11, 0.05); }
        .ad-tag { background: #f59e0b; color: #000; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }

        /* تفاعلات المنشور (إعجاب وحذف) */
        .post-actions { display: flex; gap: 15px; border-top: 1px solid var(--border-color); padding-top: 8px; font-size: 13px; color: var(--secondary-text); align-items: center; }
        .action-item { cursor: pointer; transition: 0.2s; }
        .action-item:hover { color: var(--primary-color); }
        .delete-btn { color: #f87171; background: none; border: none; cursor: pointer; font-size: 12px; font-weight: bold; }

        .friend-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg-color); padding: 10px 15px; border-radius: 8px; margin-bottom: 10px; border: 1px solid var(--border-color); }
        .friend-name { color: var(--text-color); font-weight: bold; }

        /* شريط التنقل السفلي */
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card-bg); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid var(--border-color); z-index: 100; }
        .nav-item { color: var(--secondary-text); text-decoration: none; font-size: 12px; text-align: center; cursor: pointer; }
        .nav-item.active { color: var(--primary-color); font-weight: bold; }
    </style>
</head>
<body id="pageBody">

    <div class="header">
        <h2 id="appTitle">MYGRAM</h2>
        <div class="header-btns">
            <button class="btn-theme" onclick="toggleTheme()">🌓 النمط</button>
            <button class="btn-logout" onclick="logout()">خروج</button>
        </div>
    </div>

    <div class="container" id="mainContent"></div>

    <div class="nav-bar">
        <div class="nav-item active" onclick="switchTab('home', this)">🏠 الرئيسية</div>
        <div class="nav-item" onclick="switchTab('friends', this)">👥 الأصدقاء</div>
        <div class="nav-item" onclick="switchTab('groups', this)">🛡️ المجموعات</div>
        <div class="nav-item" onclick="switchTab('profile', this)">⚙️ حسابي</div>
    </div>

    <script>
        let currentUser = localStorage.getItem('mygram_username') || 'مستخدم مجهول';
        let currentTab = 'home';

        // تحميل الوضع الليلي/النهاري المحفوظ
        if (localStorage.getItem('mygram_theme') === 'light') {
            document.getElementById('pageBody').classList.add('light-mode');
        }

        function toggleTheme() {
            const body = document.getElementById('pageBody');
            body.classList.toggle('light-mode');
            if (body.classList.contains('light-mode')) {
                localStorage.setItem('mygram_theme', 'light');
            } else {
                localStorage.setItem('mygram_theme', 'dark');
            }
        }

        function renderContent() {
            const content = document.getElementById('mainContent');
            
            if (currentTab === 'home') {
                document.getElementById('appTitle').innerText = 'MYGRAM';
                content.innerHTML = `
                    <div class="post-box">
                        <textarea id="postText" placeholder="بماذا تفكر يا غالي؟"></textarea>
                        <button onclick="addPost()">نشر</button>
                        <div style="clear: both;"></div>
                    </div>
                    <div id="postsContainer"></div>
                `;
                loadPosts();
            } else if (currentTab === 'friends') {
                document.getElementById('appTitle').innerText = 'الأصدقاء والمشاهير';
                content.innerHTML = `
                    <div class="card-box">
                        <h3 style="color: var(--primary-color); margin-top: 0;">اقتراحات المتابعة</h3>
                        <div class="friend-item">
                            <span class="friend-name">سيف الدين (مهندس برمجيات)</span>
                            <button class="add-btn" onclick="alert('تم إرسال طلب المتابعة بنجاح!')">متابعة</button>
                        </div>
                        <div class="friend-item">
                            <span class="friend-name">محمد الشامي (مصمم جرافيك)</span>
                            <button class="add-btn" onclick="alert('تم إرسال طلب المتابعة بنجاح!')">متابعة</button>
                        </div>
                    </div>
                `;
            } else if (currentTab === 'groups') {
                document.getElementById('appTitle').innerText = 'المجموعات العامة';
                content.innerHTML = `
                    <div class="card-box">
                        <h3 style="color: var(--primary-color); margin-top: 0;">المجتمعات المتاحة</h3>
                        <div class="friend-item">
                            <span class="friend-name">🛡️ مجتمع تقنيات الويب والـ APK</span>
                            <button class="add-btn" onclick="alert('انضممت للمجموعة بنجاح!')">انضمام</button>
                        </div>
                    </div>
                `;
            } else if (currentTab === 'profile') {
                document.getElementById('appTitle').innerText = 'الملف الشخصي';
                let bio = localStorage.getItem('mygram_bio') || 'لم تضف نبذة تعريفية بعد...';
                content.innerHTML = `
                    <div class="card-box" style="text-align: center;">
                        <div style="font-size: 50px; margin-bottom: 10px;">👤</div>
                        <div class="post-author" style="font-size: 18px; margin-bottom: 5px; justify-content: center;">${currentUser}</div>
                        <p style="color: var(--secondary-text); font-size: 14px;">${bio}</p>
                        <button class="action-btn" onclick="editBio()">تعديل النبذة التعريفية</button>
                    </div>
                `;
            }
        }

        function addPost() {
            const text = document.getElementById('postText').value;
            if (!text.trim()) return;

            let posts = JSON.parse(localStorage.getItem('mygram_posts') || '[]');
            posts.unshift({ id: Date.now(), author: currentUser, content: text, likes: 0 });
            localStorage.setItem('mygram_posts', JSON.stringify(posts));

            document.getElementById('postText').value = '';
            loadPosts();
        }

        function loadPosts() {
            let posts = JSON.parse(localStorage.getItem('mygram_posts') || '[]');
            const container = document.getElementById('postsContainer');
            if(!container) return;
            
            // منشور إعلاني تجريبي ممول يظهر في أعلى الخلاصة
            let html = `
                <div class="ad-card">
                    <div class="post-author">
                        <span>إعلان ممول 📢</span>
                        <span class="ad-tag">مُعْلَن</span>
                    </div>
                    <div class="post-text">هل تبحث عن تطوير تطبيقات أسرع واحترافية؟ جرب منصات الويب الحديثة وحقق طموحك اليوم مع MYGRAM!</div>
                </div>
                <div class="post-card">
                    <div class="post-author">النظام (مرحباً بك)</div>
                    <div class="post-text">أهلاً بك في منصة MYGRAM الاجتماعية! ابدأ بنشر أول منشور لك الآن.</div>
                </div>
            `;

            posts.forEach((p, index) => {
                let deleteOption = p.author === currentUser ? `<button class="delete-btn" onclick="deletePost(${p.id || index})">حذف</button>` : '';
                html += `
                    <div class="post-card">
                        <div class="post-author">
                            <span>${p.author}</span>
                            ${deleteOption}
                        </div>
                        <div class="post-text">${p.content}</div>
                        <div class="post-actions">
                            <span class="action-item" onclick="likePost(${p.id || index})">❤️ إعجاب (${p.likes || 0})</span>
                            <span class="action-item" onclick="alert('خاصية التعليقات قادمة قريباً!')">💬 تعليق</span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function likePost(id) {
            let posts = JSON.parse(localStorage.getItem('mygram_posts') || '[]');
            let post = posts.find(p => (p.id === id) || (posts.indexOf(p) === id));
            if(post) {
                post.likes = (post.likes || 0) + 1;
                localStorage.setItem('mygram_posts', JSON.stringify(posts));
                loadPosts();
            }
        }

        function deletePost(id) {
            let posts = JSON.parse(localStorage.getItem('mygram_posts') || '[]');
            posts = posts.filter(p => p.id !== id && posts.indexOf(p) !== id);
            localStorage.setItem('mygram_posts', JSON.stringify(posts));
            loadPosts();
        }

        function editBio() {
            let newBio = prompt('أدخل نبذة تعريفية جديدة عنك:');
            if (newBio !== null && newBio.trim() !== '') {
                localStorage.setItem('mygram_bio', newBio);
                renderContent();
            }
        }

        function switchTab(tab, element) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
            currentTab = tab;
            renderContent();
        }

        window.onload = function() {
            renderContent();
        };

        function logout() {
            localStorage.removeItem('mygram_username');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
