<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYGRAM - Global Super Ecosystem (Home)</title>
    <style>
        :root {
            --bg-main: #050b14;
            --card-bg: #0f172a;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #1e293b;
            --btn-bg: #1e293b;
            --online-green: #22c55e;
            --ad-gold: #f59e0b;
            --live-red: #ef4444;
            --error-red: #ef4444;
        }
        .light-mode {
            --bg-main: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border: #cbd5e1;
            --btn-bg: #e2e8f0;
        }

        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg-main); color: var(--text-main); margin: 0; padding-top: 65px; padding-bottom: 80px; transition: 0.3s; box-sizing: border-box; }
        
        /* الهيدر العلوي الذكي */
        .header { display: flex; justify-content: space-between; align-items: center; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); padding: 12px 20px; border-bottom: 1px solid var(--border); position: fixed; top: 0; width: 100%; z-index: 1000; box-sizing: border-box; transition: transform 0.3s ease; }
        .header.hide { transform: translateY(-100%); }
        .header-title-box { text-align: center; }
        h2 { color: var(--primary); margin: 0; font-size: 16px; font-weight: 900; }
        .sub-slogan-header { font-size: 8px; color: var(--text-sub); }
        .btn-icon { background: none; border: none; color: var(--text-main); font-size: 18px; cursor: pointer; padding: 4px; }

        /* شريط التنقل السفلي */
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid var(--border); z-index: 1000; transition: transform 0.3s ease; }
        .nav-bar.hide { transform: translateY(100%); }
        .nav-item { color: var(--text-sub); font-size: 10px; text-align: center; cursor: pointer; flex: 1; font-weight: 600; }
        .nav-item.active { color: var(--primary); font-weight: 800; }

        /* القائمة الجانبية */
        .sidebar { height: 100%; width: 0; position: fixed; z-index: 2000; top: 0; right: 0; background: var(--card-bg); overflow-x: hidden; transition: 0.3s; padding-top: 60px; border-left: 1px solid var(--border); }
        html[dir="ltr"] .sidebar { left: 0; right: auto; border-right: 1px solid var(--border); border-left: none; }
        .sidebar a { padding: 14px 22px; text-decoration: none; font-size: 13px; color: var(--text-main); display: block; border-bottom: 1px solid var(--border); transition: 0.2s; }
        .sidebar a:hover { background: var(--primary); color: #050b14; font-weight: bold; }
        .sidebar .close-btn { position: absolute; top: 12px; font-size: 24px; cursor: pointer; color: var(--primary); }
        html[dir="rtl"] .sidebar .close-btn { left: 18px; }
        html[dir="ltr"] .sidebar .close-btn { right: 18px; }

        .container { max-width: 600px; margin: 10px auto; padding: 0 12px; }
        
        /* شريط القصص */
        .stories-bar { display: flex; gap: 12px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 6px; }
        .story-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; min-width: 64px; }
        .story-avatar-wrap { position: relative; width: 58px; height: 58px; border-radius: 50%; padding: 2px; background: linear-gradient(45deg, #0284c7, #38bdf8); }
        .story-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid var(--card-bg); display: flex; justify-content: center; align-items: center; font-size: 26px; background: var(--bg-main); }
        .story-name { font-size: 10px; color: var(--text-sub); margin-top: 5px; text-align: center; max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* الأقسام السريعة */
        .quick-bar { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 4px; }
        .quick-pill { background: var(--btn-bg); border: 1px solid var(--border); padding: 7px 16px; border-radius: 20px; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap; color: var(--primary); transition: 0.2s; }
        .quick-pill:hover { background: var(--primary); color: #050b14; }

        .post-box, .post-card, .card-box { background: var(--card-bg); padding: 18px; border-radius: 18px; margin-bottom: 16px; border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        input, select, textarea { width: 100%; background: var(--bg-main); border: 1px solid var(--border); color: var(--text-main); border-radius: 12px; padding: 12px 14px; resize: none; box-sizing: border-box; font-family: inherit; font-size: 13px; margin-bottom: 10px; outline: none; transition: 0.2s; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }

        .post-tools { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
        .action-btn { background: var(--btn-bg); color: var(--text-main); border: 1px solid var(--border); padding: 8px 14px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 11px; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .action-btn:hover { border-color: var(--primary); color: var(--primary); }
        .action-btn.btn-primary { background: var(--primary); color: #050b14; border: none; font-weight: 800; }

        .post-author-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
        .avatar-container { position: relative; width: 44px; height: 44px; }
        .mini-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); background: var(--bg-main); display: flex; justify-content: center; align-items: center; font-size: 22px; }
        .online-dot { position: absolute; bottom: 0; right: 0; width: 10px; height: 10px; background: var(--online-green); border-radius: 50%; border: 2px solid var(--card-bg); }
        .post-author-info { flex: 1; font-weight: bold; color: var(--primary); font-size: 13px; }
        .sponsored-tag { background: rgba(245, 158, 11, 0.15); color: var(--ad-gold); border: 1px solid var(--ad-gold); padding: 2px 8px; border-radius: 6px; font-size: 9px; font-weight: bold; margin-left: 6px; }

        .profile-avatar-big { width: 110px; height: 110px; border-radius: 50%; border: 3px solid var(--primary); margin: 0 auto 12px; display: flex; justify-content: center; align-items: center; font-size: 55px; background: var(--bg-main); position: relative; overflow: hidden; }
        .profile-avatar-big img { width: 100%; height: 100%; object-fit: cover; }

        .post-text { font-size: 13px; line-height: 1.6; margin-bottom: 10px; white-space: pre-line; }
        .post-image-container { position: relative; overflow: hidden; border-radius: 12px; margin-top: 10px; }
        .post-image { width: 100%; max-height: 380px; object-fit: cover; display: block; border-radius: 12px; }
        .media-blur { filter: blur(28px); }
        .sensitive-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; text-align: center; padding: 20px; box-sizing: border-box; }

        .post-actions { display: flex; justify-content: space-between; border-top: 1px solid var(--border); padding-top: 12px; margin-top: 12px; font-size: 11px; color: var(--text-sub); }
        .action-item { cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .action-item:hover { color: var(--primary); }

        .chat-container { display: flex; flex-direction: column; height: 58vh; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 12px; background: var(--bg-main); border-radius: 12px; margin-bottom: 12px; border: 1px solid var(--border); }
        .chat-msg { margin-bottom: 10px; padding: 10px 14px; border-radius: 10px; max-width: 80%; font-size: 12px; line-height: 1.5; }
        .chat-msg.user { background: var(--primary); color: #050b14; font-weight: 600; margin-left: auto; }
        .chat-msg.peer { background: var(--card-bg); border: 1px solid var(--border); margin-right: auto; }

        .tab-sub-bar { display: flex; gap: 8px; margin-bottom: 14px; }
        .tab-sub-btn { flex: 1; padding: 9px; text-align: center; background: var(--bg-main); border: 1px solid var(--border); border-radius: 10px; font-size: 11px; cursor: pointer; color: var(--text-main); font-weight: 600; }
        .tab-sub-btn.active { background: var(--primary); color: #050b14; font-weight: 800; border-color: var(--primary); }

        .toast { position: fixed; top: 75px; left: 50%; transform: translateX(-50%); background: var(--primary); color: #050b14; padding: 9px 20px; border-radius: 20px; font-size: 12px; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.4); z-index: 3000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; }

        .info-row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px dashed var(--border); font-size: 12px; }
        .group-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg-main); padding: 12px 14px; border-radius: 10px; margin-bottom: 10px; border: 1px solid var(--border); }
        .group-name { color: var(--text-main); font-weight: bold; font-size: 12px; }
        label.edit-label { display: block; text-align: right; font-size: 11px; color: var(--primary); margin-top: 8px; margin-bottom: 3px; }
        html[dir="ltr"] label.edit-label { text-align: left; }

        .live-badge { background: var(--live-red); color: #fff; padding: 2px 8px; border-radius: 6px; font-size: 9px; font-weight: bold; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>
</head>
<body id="pageBody">

    <div class="toast" id="toastMsg"></div>

    <!-- القائمة الجانبية -->
    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="close-btn" onclick="closeSidebar()">&times;</a>
        <a href="#" onclick="switchTab('feed'); closeSidebar();">🏠 ماذا يدور الآن؟</a>
        <a href="#" onclick="switchTab('reels'); closeSidebar();">🎬 ريلز وشورتس العالمية</a>
        <a href="#" onclick="switchTab('live'); closeSidebar();">🔴 البث المباشر (LIVE)</a>
        <a href="#" onclick="switchTab('create_page'); closeSidebar();">📄 إنشاء صفحة جديدة</a>
        <a href="#" onclick="switchTab('create_group'); closeSidebar();">👥 إنشاء مجموعة جديدة</a>
        <a href="#" onclick="switchTab('ads_manager'); closeSidebar();">📣 مدير الإعلانات (MYGRAM Ads)</a>
        <a href="#" onclick="switchTab('profile'); closeSidebar();">👤 الملف الشخصي والبيانات</a>
        <a href="#" onclick="switchTab('accounts'); closeSidebar();">🔄 إدارة الحسابات والتبديل</a>
        <a href="#" onclick="switchTab('news'); closeSidebar();">🌐 MYGRAM NEWS</a>
        <a href="#" onclick="logoutApp();">🚪 تسجيل الخروج</a>
    </div>

    <!-- الهيدر العلوي -->
    <div class="header" id="mainHeader">
        <button class="btn-icon" onclick="openSidebar()">☰</button>
        <div class="header-title-box">
            <h2 id="appTitle">MYGRAM</h2>
            <div class="sub-slogan-header">Everything you need is here</div>
        </div>
        <div style="display:flex; gap:6px; align-items:center;">
            <select id="appLangSelect" onchange="changeLanguage(this.value)" style="background:var(--bg-main); color:var(--text-main); border:1px solid var(--border); border-radius:6px; font-size:10px; padding:3px 6px; margin:0; outline:none;"></select>
            <button class="btn-icon" onclick="toggleThemeMode()">🌓</button>
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="container" id="mainContentArea"></div>

    <!-- شريط التنقل السفلي -->
    <div class="nav-bar" id="mainNavBar">
        <div class="nav-item active" onclick="switchTab('feed', this)">ما يدور</div>
        <div class="nav-item" onclick="switchTab('reels', this)">ريلز</div>
        <div class="nav-item" onclick="switchTab('ai', this)">المساعد AI</div>
        <div class="nav-item" onclick="switchTab('chats', this)">CHAT</div>
        <div class="nav-item" onclick="switchTab('profile', this)">حسابي</div>
    </div>

    <script>
        const globalLanguages = [
            {code:"ar", name:"العربية", rtl:true}, {code:"en", name:"English", rtl:false},
            {code:"fr", name:"Français", rtl:false}, {code:"tr", name:"Türkçe", rtl:false},
            {code:"ru", name:"Русский", rtl:false}, {code:"zh", name:"中文", rtl:false}
        ];

        let currentAccount = JSON.parse(localStorage.getItem('mygram_current_account') || '{}');
        let currentUser = currentAccount.name || 'Louay Chaghal';
        let userGender = currentAccount.gender || 'male';
        
        function calculateExactAge(birthdateStr) {
            if(!birthdateStr) return currentAccount.age || 18;
            const birthDate = new Date(birthdateStr);
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            return age;
        }

        let userAge = calculateExactAge(currentAccount.birthDate);
        let currentTab = 'feed';
        let chatSubTab = 'contacts';
        let attachedMedia = '';

        function initApp() {
            const select = document.getElementById('appLangSelect');
            if(select) {
                select.innerHTML = globalLanguages.map(l => `<option value="${l.code}">${l.name}</option>`).join('');
                select.value = localStorage.getItem('mygram_lang') || 'ar';
            }
            renderAppContent();
        }

        function changeLanguage(code) {
            localStorage.setItem('mygram_lang', code);
            const langObj = globalLanguages.find(l => l.code === code) || globalLanguages[0];
            const htmlTag = document.getElementById('htmlRoot');
            if(htmlTag) {
                htmlTag.setAttribute('lang', code);
                htmlTag.setAttribute('dir', langObj.rtl ? 'rtl' : 'ltr');
            }
            showToast('تم تحديث لغة التطبيق بنجاح!');
            renderAppContent();
        }

        function showToast(msg) {
            const t = document.getElementById('toastMsg');
            if(!t) return;
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        let lastScrollTop = 0;
        window.addEventListener('scroll', function() {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            const header = document.getElementById('mainHeader');
            const navBar = document.getElementById('mainNavBar');
            if (scrollTop > lastScrollTop && scrollTop > 50) {
                if(header) header.classList.add('hide'); 
                if(navBar) navBar.classList.add('hide');
            } else {
                if(header) header.classList.remove('hide'); 
                if(navBar) navBar.classList.remove('hide');
            }
            lastScrollTop = scrollTop;
        });

        function openSidebar() { document.getElementById("mySidebar").style.width = "270px"; }
        function closeSidebar() { document.getElementById("mySidebar").style.width = "0"; }

        function toggleThemeMode() {
            document.getElementById('pageBody').classList.toggle('light-mode');
            showToast('تم تغيير مظهر التطبيق بنجاح!');
        }

        function switchTab(tab, el) {
            if(el) {
                document.querySelectorAll('.nav-
