<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYGRAM - المنصة الشاملة</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #fff;
            --border-color: #334155;
            --primary-color: #38bdf8;
            --secondary-text: #94a3b8;
        }
        .light-mode {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --border-color: #cbd5e1;
            --primary-color: #0284c7;
            --secondary-text: #64748b;
        }

        body { font-family: sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding-bottom: 70px; transition: 0.3s; }
        .header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 12px 20px; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
        h2 { color: var(--primary-color); margin: 0; font-size: 18px; }
        .header-btns { display: flex; gap: 8px; }
        .btn-theme, .btn-logout { border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-theme { background: #475569; color: #fff; }
        .btn-logout { background: #f87171; color: #fff; }
        
        .container { max-width: 600px; margin: 15px auto; padding: 0 15px; }
        
        .post-box, .card-box, .post-card { background: var(--card-bg); padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .post-box textarea { width: 100%; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 8px; padding: 10px; resize: none; box-sizing: border-box; height: 75px; font-family: sans-serif; }
        
        .post-tools { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
        .action-btn, .add-btn, .ai-gen-btn { background: var(--primary-color); color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .ai-gen-btn { background: linear-gradient(135deg, #8b5cf6, #38bdf8); }
        
        .post-author { font-weight: bold; color: var(--primary-color); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .post-text { color: var(--text-color); font-size: 14px; line-height: 1.5; margin-bottom: 8px; }
        .post-image { width: 100%; border-radius: 8px; margin-top: 8px; max-height: 300px; object-fit: cover; }
        
        .post-actions { display: flex; gap: 15px; border-top: 1px solid var(--border-color); padding-top: 8px; font-size: 12px; color: var(--secondary-text); align-items: center; }
        .action-item { cursor: pointer; transition: 0.2s; }
        .action-item:hover { color: var(--primary-color); }
        .delete-btn { color: #f87171; background: none; border: none; cursor: pointer; font-size: 11px; font-weight: bold; }

        /* الشات والمراسلة والذكاء الاصطناعي */
        .chat-container { display: flex; flex-direction: column; height: 55vh; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 10px; background: var(--bg-color); border-radius: 8px; margin-bottom: 10px; border: 1px solid var(--border-color); }
        .chat-msg { margin-bottom: 8px; padding: 8px 10px; border-radius: 8px; max-width: 80%; font-size: 13px; line-height: 1.4; }
        .chat-msg.user { background: var(--primary-color); color: #fff; margin-left: auto; }
        .chat-msg.ai, .chat-msg.peer { background: var(--card-bg); border: 1px solid var(--border-color); margin-right: auto; }
        .chat-input-box { display: flex; gap: 6px; }
        .chat-input-box input { flex: 1; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); padding: 8px; border-radius: 6px; font-size: 13px; }

        .friend-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg-color); padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--border-color); }
        .friend-name { color: var(--text-color); font-weight: bold; font-size: 13px; }

        /* شريط التنقل السفلي الخماسي المدمج */
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card-bg); display: flex; justify-content: space-around; padding: 8px 0; border-top: 1px solid var(--border-color); z-index: 100; }
        .nav-item { color: var(--secondary-text); text-decoration: none; font-size: 11px; text-align: center; cursor: pointer; }
        .nav-item.active { color: var(--primary-color); font-weight: bold; }
    </style>
</head>
<body id="pageBody">

    <div class="header">
        <h2 id="appTitle">MYGRAM</h2>
        <div class="header-btns">
            <button class="btn-theme" onclick="toggleTheme()">🌓 الثيم</button>
            <button class="btn-logout" onclick="logout()">خروج</button>
        </div>
    </div>

    <div class="container" id="mainContent"></div>

    <!-- شريط تنقل شامل (فيسبوك، انستغرام، تيليجرام، واتساب، ذكاء اصطناعي) -->
    <div class="nav-bar">
        <div class="nav-item active" onclick="switchTab('home', this)">📰 الخلاصة</div>
        <div class="nav-item" onclick="switchTab('ai', this)">🤖 المساعد</div>
        <div class="nav-item" onclick="switchTab('messenger', this)">💬 مسنجر</div>
        <div class="nav-item" onclick="switchTab('groups', this)">🛡️ مجموعات</div>
        <div class="nav-item" onclick="switchTab('profile', this)">⚙️ حسابي</div>
    </div>

    <script>
        let currentUser = localStorage.getItem('mygram_username') || 'مستخدم مجهول';
        let currentTab = 'home';
        let uploadedImage = '';

        if (localStorage.getItem('mygram_theme') === 'light') {
            document.getElementById('pageBody').classList.add('light-mode');
        }

        function toggleTheme() {
            const body = document.getElementById('pageBody');
            body.classList.toggle('light-mode');
            localStorage.setItem('mygram_theme', body.classList.contains('light-mode') ? 'light' : 'dark');
        }

        function renderContent() {
            const content = document.getElementById('mainContent');
            
            if (currentTab === 'home') {
                document.getElementById('appTitle').innerText = 'MYGRAM - الخلاصة';
                content.innerHTML = `
                    <div class="post-box">
                        <textarea id="postText" placeholder="بماذا تفكر يا غالي؟ شارك أفكارك أو صورك..."></textarea>
                        <div id="imagePreviewContainer" style="margin-bottom: 8px;"></div>
                        <div class="post-tools">
                            <label class="action-btn" style="cursor:pointer; margin-top:0;">📁 رفع صورة<input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleImageUpload(event)"></label>
                            <button class="ai-gen-btn" onclick="generateAIImage()">🎨 صورة AI</button>
                            <button class="action-btn" onclick="addPost()" style="margin-top:0; margin-right:auto;">نشر</button>
                        </div>
                    </div>
                    <div id="postsContainer"></div>
                `;
                loadPosts();
            } else if (currentTab === 'ai') {
                document.getElementById('appTitle').innerText = 'المساعد الذكي (AI)';
                content.innerHTML = `
                    <div class="card-box chat-container">
                        <h3 style="color: var(--primary-color); margin-top: 0; font-size: 14px;">دردش مع ذكاء MYGRAM الاصطناعي</h3>
                        <div class="chat-messages" id="chatMessages">
                            <div class="chat-msg ai">أهلاً بك يا ${currentUser}! أنا مساعدك الذكي المدمج، كيف يمكنني خدمتك اليوم؟</div>
                        </div>
                        <div class="chat-input-box">
                            <input type="text" id="chatInput" placeholder="اكتب سؤالك هنا...">
                            <button class="action-btn" onclick="sendAiMessage()" style="margin-top:0;">إرسال</button>
                        </div>
                    </div>
                `;
            } else if (currentTab === 'messenger') {
                document.getElementById('appTitle').innerText = 'محادثات المسنجر وواتساب';
                content.innerHTML = `
                    <div class="card-box chat-container">
                        <h3 style="color: var(--primary-color); margin-top: 0; font-size: 14px;">دردشة مباشرة مع الأصدقاء</h3>
                        <div class="chat-messages" id="msgMessages">
                            <div class="chat-msg peer">سيف الدين: أهلاً بك في نظام الدردشة المباشر الخاص بالتطبيق!</div>
                        </div>
                        <div class="chat-input-box">
                            <input type="text" id="msgInput" placeholder="اكتب رسالة لتبادلها...">
                            <button class="action-btn" onclick="sendDirectMessage()" style="margin-top:0;">إرسال</button>
                        </div>
                    </div>
                `;
            } else if (currentTab === 'groups') {
                document.getElementById('appTitle').innerText = 'المجموعات والقنوات';
                content.innerHTML = `
                    <div class="card-box">
                        <h3 style="color: var(--primary-color); margin-top: 0; font-size: 14px;">المجتمعات المتاحة</h3>
                        <div class="friend-item">
                            <span class="friend-name">🛡️ قناة المطورين والتقنية (تليجرام)</span>
                            <button class="add-btn" onclick="alert('تم الانضمام للقناة بنجاح!')">انضمام</button>
                        </div>
                        <div class="friend-item">
                            <span class="friend-name">💡 مجموعة راد الأعمال والمشاريع</span>
                            <button class="add-btn" onclick="alert('تم الانضمام للمجموعة بنجاح!')">انضمام</button>
                        </div>
                    </div>
                `;
            } else if (currentTab === 'profile') {
                document.getElementById('appTitle').innerText = 'الملف الشخصي والحساب';
                let bio = localStorage.getItem('mygram_bio') || 'لم تضف نبذة تعريفية بعد...';
                content.innerHTML = `
                    <div class="card-box" style="text-align: center;">
                        <div style="font-size: 45px; margin-bottom: 8px;">👤</div>
                        <div class="post-author" style="font-size: 16px; margin-bottom: 5px; justify-content: center;">${currentUser}</div>
                        <p style="color: var(--secondary-text); font-size: 13px; margin-bottom: 12px;" id="bioText">${bio}</p>
                        <button class="action-btn" onclick="editBio()" style="margin-bottom:8px;">تعديل النبذة</button>
                    </div>
                `;
            }
        }

        // رفع صورة من الهاتف
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedImage = e.target.result;
                document.getElementById('imagePreviewContainer').innerHTML = `
                    <div style="font-size: 11px; color: var(--primary-color); margin-bottom: 4px;">تم تحميل الصورة من الهاتف بنجاح:</div>
                    <img src="${uploadedImage}" class="post-image" alt="Uploaded">
                `;
            };
            reader.readAsDataURL(file);
        }

        // توليد صورة بالذكاء الاصطناعي
        function generateAIImage() {
            let promptText = prompt('أدخل وصفاً للصورة المطلوبة بالـ AI:', 'futuristic cyberpunk city night');
            if(!promptText) return;
            alert('جاري التوليد الفوري...');
            uploadedImage = `https://image.pollinations.ai/prompt/${encodeURIComponent(promptText)}`;
            document.getElementById('imagePreviewContainer').innerHTML = `
                <div style="font-size: 11px; color: var(--primary-color); margin-bottom: 4px;">تم توليد صورة الذكاء الاصطناعي بنجاح:</div>
                <img src="${uploadedImage}" class="post-image" alt="AI Generated">
            `;
        }

        function addPost() {
            const text = document.getElementById('postText').value;
            if(!text.trim() && !uploadedImage) return;

            let posts = JSON.parse(localStorage.getItem('mygram_posts') || '[]');
            posts.unshift({ id: Date.now(), author: currentUser, content: text, image: uploadedImage, likes: 0 });
            localStorage.setItem('mygram_posts', JSON.stringify(posts));

            uploadedImage = '';
            document.getElementById('postText').value = '';
            loadPosts();
        }

        function loadPosts() {
            let posts = JSON.parse(localStorage.getItem('mygram_posts') || '[]');
            const container = document.getElementById('postsContainer');
            if(!container) return;
            
            let html = `
                <div class="post-card" style="border: 1px dashed var(--primary-color);">
                    <div class="post-author">النظام الرسمي</div>
                    <div class="post-text">أهلاً بك في منصة MYGRAM الشاملة والمزودة بخصائص التواصل والمساعد الذكي!</div>
                </div>
            `;

            posts.forEach((p, index) => {
                let deleteOption = p.author === currentUser ? `<button class="delete-btn" onclick="deletePost(${p.id || index})">حذف</button>` : '';
                let imageTag = p.image ? `<img src="${p.image}" class="post-image" alt="Post Image">` : '';
                html += `
                    <div class="post-card">
                        <div class="post-author"><span>${p.author}</span>${deleteOption}</div>
                        <div class="post-text">${p.content}</div>
                        ${imageTag}
                        <div class="post-actions">
                            <span class="action-item" onclick="likePost(${p.id || index})">❤️ إعجاب (${p.likes || 0})</span>
                            <span class="action-item" onclick="alert('خاصية التعليقات مفعلة وجاهزة للنقاش!')">💬 تعليق</span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function sendAiMessage() {
            const inputField = document.getElementById('chatInput');
            const msg = inputField.value.trim();
            if(!msg) return;
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML += `<div class="chat-msg user">${msg}</div>`;
            inputField.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            setTimeout(() => {
                chatMessages.innerHTML += `<div class="chat-msg ai">أهلاً بك، تم استلام استفسارك بنجاح. منصة MYGRAM تجمع أفضل ميزات التواصل والذكاء الاصطناعي لك!</div>`;
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 600);
        }

        function sendDirectMessage() {
            const inputField = document.getElementById('msgInput');
            const msg = inputField.value.trim();
            if(!msg) return;
            const msgMessages = document.getElementById('msgMessages');
            msgMessages.innerHTML += `<div class="chat-msg user">${msg}</div>`;
            inputField.value = '';
            msgMessages.scrollTop = msgMessages.scrollHeight;

            setTimeout(() => {
                msgMessages.innerHTML += `<div class="chat-msg peer">سيف الدين: تم استلام رسالتك الفورية بنجاح وكأننا في محادثة واتساب!</div>`;
                msgMessages.scrollTop = msgMessages.scrollHeight;
            }, 600);
        }

        function likePost(id) {
            let posts = JSON.parse(localStorage.getItem('mygram_posts') || '[]');
            let post = posts.find(p => (p.id === id) || (posts.indexOf(p) === id));
            if(post) {
                post.likes = (post.likes || 0) + 1;
                localStorage.setItem('mygram_posts', JSON.stringify(posts));
                loadPosts();
            }
        }

        function deletePost(id) {
            let posts = JSON.parse(localStorage.getItem('mygram_posts') || '[]');
            posts = posts.filter(p => p.id !== id && posts.indexOf(p) !== id);
            localStorage.setItem('mygram_posts', JSON.stringify(posts));
            loadPosts();
        }

        function editBio() {
            let newBio = prompt('أدخل نبذة تعريفية جديدة:');
            if(newBio !== null && newBio.trim() !== '') {
                localStorage.setItem('mygram_bio', newBio);
                renderContent();
            }
        }

        function switchTab(tab, element) {
            document.querySelectorAll('.nav-item').items = document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            element.classList.add('active');
            currentTab = tab;
            renderContent();
        }

        window.onload = function() {
            renderContent();
        };

        function logout() {
            localStorage.removeItem('mygram_username');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
