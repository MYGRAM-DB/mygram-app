<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYGRAM - Global Super Ecosystem (WhatsApp Style Chat)</title>
    <style>
        :root {
            --bg-main: #050b14;
            --card-bg: #0f172a;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #1e293b;
            --btn-bg: #1e293b;
            --online-green: #22c55e;
            --ad-gold: #f59e0b;
            --live-red: #ef4444;
        }
        .light-mode {
            --bg-main: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border: #cbd5e1;
            --btn-bg: #e2e8f0;
        }

        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg-main); color: var(--text-main); margin: 0; padding-top: 65px; padding-bottom: 80px; transition: 0.3s; box-sizing: border-box; }
        
        .header { display: flex; justify-content: space-between; align-items: center; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); padding: 12px 20px; border-bottom: 1px solid var(--border); position: fixed; top: 0; width: 100%; z-index: 1000; box-sizing: border-box; }
        .header-title-box { text-align: center; }
        h2 { color: var(--primary); margin: 0; font-size: 16px; font-weight: 900; }
        .sub-slogan-header { font-size: 8px; color: var(--text-sub); }
        .btn-icon { background: none; border: none; color: var(--text-main); font-size: 18px; cursor: pointer; padding: 4px; }

        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid var(--border); z-index: 1000; }
        .nav-item { color: var(--text-sub); font-size: 10px; text-align: center; cursor: pointer; flex: 1; font-weight: 600; }
        .nav-item.active { color: var(--primary); font-weight: 800; }

        .sidebar { height: 100%; width: 0; position: fixed; z-index: 2000; top: 0; right: 0; background: var(--card-bg); overflow-x: hidden; transition: 0.3s; padding-top: 60px; border-left: 1px solid var(--border); }
        .sidebar a { padding: 14px 22px; text-decoration: none; font-size: 13px; color: var(--text-main); display: block; border-bottom: 1px solid var(--border); transition: 0.2s; }
        .sidebar a:hover { background: var(--primary); color: #050b14; font-weight: bold; }
        .sidebar .close-btn { position: absolute; top: 12px; font-size: 24px; cursor: pointer; color: var(--primary); left: 18px; }

        .container { max-width: 600px; margin: 10px auto; padding: 0 12px; }
        
        .stories-bar { display: flex; gap: 12px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 6px; }
        .story-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; min-width: 64px; }
        .story-avatar-wrap { position: relative; width: 58px; height: 58px; border-radius: 50%; padding: 2px; background: linear-gradient(45deg, #0284c7, #38bdf8); }
        .story-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid var(--card-bg); display: flex; justify-content: center; align-items: center; font-size: 26px; background: var(--bg-main); }
        .story-name { font-size: 10px; color: var(--text-sub); margin-top: 5px; text-align: center; max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .quick-bar { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 4px; }
        .quick-pill { background: var(--btn-bg); border: 1px solid var(--border); padding: 7px 16px; border-radius: 20px; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap; color: var(--primary); transition: 0.2s; }
        .quick-pill:hover { background: var(--primary); color: #050b14; }

        .post-box, .post-card, .card-box { background: var(--card-bg); padding: 18px; border-radius: 18px; margin-bottom: 16px; border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        input, select, textarea { width: 100%; background: var(--bg-main); border: 1px solid var(--border); color: var(--text-main); border-radius: 12px; padding: 12px 14px; resize: none; box-sizing: border-box; font-family: inherit; font-size: 13px; margin-bottom: 10px; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }

        .action-btn { background: var(--btn-bg); color: var(--text-main); border: 1px solid var(--border); padding: 8px 14px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 11px; display: inline-flex; align-items: center; gap: 6px; }
        .action-btn:hover { border-color: var(--primary); color: var(--primary); }
        .action-btn.btn-primary { background: var(--primary); color: #050b14; border: none; font-weight: 800; }

        /* تنسيق محادثات واتساب (WhatsApp Style Chat List) */
        .wa-chat-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; transition: 0.2s; border-radius: 10px; margin-bottom: 4px; }
        .wa-chat-item:hover { background: var(--bg-main); }
        .wa-avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--bg-main); border: 1.5px solid var(--primary); display: flex; justify-content: center; align-items: center; font-size: 22px; flex-shrink: 0; }
        .wa-info { flex: 1; min-width: 0; }
        .wa-top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
        .wa-name { font-weight: bold; font-size: 13px; color: var(--text-main); }
        .wa-time { font-size: 10px; color: var(--text-sub); }
        .wa-msg { font-size: 11px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .chat-container { display: flex; flex-direction: column; height: 62vh; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 12px; background: var(--bg-main); border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--border); }
        .chat-msg { margin-bottom: 10px; padding: 10px 14px; border-radius: 10px; max-width: 80%; font-size: 12px; line-height: 1.5; }
        .chat-msg.user { background: var(--primary); color: #050b14; font-weight: 600; margin-left: auto; }
        .chat-msg.peer { background: var(--card-bg); border: 1px solid var(--border); margin-right: auto; }

        .toast { position: fixed; top: 75px; left: 50%; transform: translateX(-50%); background: var(--primary); color: #050b14; padding: 9px 20px; border-radius: 20px; font-size: 12px; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.4); z-index: 3000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; }

        .info-row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px dashed var(--border); font-size: 12px; }
        .group-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg-main); padding: 12px 14px; border-radius: 10px; margin-bottom: 10px; border: 1px solid var(--border); }
        label.edit-label { display: block; text-align: right; font-size: 11px; color: var(--primary); margin-top: 8px; margin-bottom: 3px; }
        .live-badge { background: var(--live-red); color: #fff; padding: 2px 8px; border-radius: 6px; font-size: 9px; font-weight: bold; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>
</head>
<body id="pageBody">

    <div class="toast" id="toastMsg"></div>

    <!-- القائمة الجانبية -->
    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="close-btn" onclick="closeSidebar()">&times;</a>
        <a href="#" onclick="switchTab('feed'); closeSidebar();">🏠 ماذا يدور الآن؟</a>
        <a href="#" onclick="switchTab('reels'); closeSidebar();">🎬 ريلز وشورتس العالمية</a>
        <a href="#" onclick="switchTab('live'); closeSidebar();">🔴 البث المباشر (LIVE)</a>
        <a href="#" onclick="switchTab('create_page'); closeSidebar();">📄 إنشاء صفحة جديدة</a>
        <a href="#" onclick="switchTab('create_group'); closeSidebar();">👥 إنشاء مجموعة جديدة</a>
        <a href="#" onclick="switchTab('ads_manager'); closeSidebar();">📣 مدير الإعلانات (MYGRAM Ads)</a>
        <a href="#" onclick="switchTab('profile'); closeSidebar();">👤 الملف الشخصي والبيانات</a>
        <a href="#" onclick="switchTab('accounts'); closeSidebar();">🔄 إدارة الحسابات والتبديل</a>
        <a href="#" onclick="switchTab('news'); closeSidebar();">🌐 MYGRAM NEWS</a>
        <a href="#" onclick="logoutApp();">🚪 تسجيل الخروج</a>
    </div>

    <!-- الهيدر العلوي مع قائمة اللغات الـ 70 الكاملة -->
    <div class="header" id="mainHeader">
        <button class="btn-icon" onclick="openSidebar()">☰</button>
        <div class="header-title-box">
            <h2 id="appTitle">MYGRAM</h2>
            <div class="sub-slogan-header">Everything you need is here</div>
        </div>
        <div style="display:flex; gap:6px; align-items:center;">
            <select id="appLangSelect" onchange="changeLanguage(this.value)" style="background:var(--bg-main); color:var(--text-main); border:1px solid var(--border); border-radius:6px; font-size:10px; padding:3px 6px; margin:0; outline:none; max-width: 110px;"></select>
            <button class="btn-icon" onclick="toggleThemeMode()">🌓</button>
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="container" id="mainContentArea"></div>

    <!-- شريط التنقل السفلي -->
    <div class="nav-bar" id="mainNavBar">
        <div class="nav-item active" onclick="switchTab('feed', this)">ما يدور</div>
        <div class="nav-item" onclick="switchTab('reels', this)">ريلز</div>
        <div class="nav-item" onclick="switchTab('ai', this)">المساعد AI</div>
        <div class="nav-item" onclick="switchTab('chats', this)">CHAT</div>
        <div class="nav-item" onclick="switchTab('profile', this)">حسابي</div>
    </div>

    <script>
        // قائمة اللغات الـ 70 العالمية الكاملة بالترتيب
        const globalLanguages = [

            {code:"fr", name:"Français (French)", rtl:false}, {code:"de", name:"Deutsch (German)", rtl:false},
            {code:"es", name:"Español (Spanish)", rtl:false}, {code:"tr", name:"Türkçe (Turkish)", rtl:false},
            {code:"ru", name:"Русский (Russian)", rtl:false}, {code:"zh", name:"中文 (Chinese)", rtl:false},
            {code:"ja", name:"日本語 (Japanese)", rtl:false}, {code:"ko", name:"한국어 (Korean)", rtl:false},
            {code:"it", name:"Italiano (Italian)", rtl:false}, {code:"pt", name:"Português (Portuguese)", rtl:false},
            {code:"hi", name:"हिन्दी (Hindi)", rtl:false}, {code:"fa", name:"فارسی (Persian)", rtl:true},
            {code:"ur", name:"اردو (Urdu)", rtl:true}, {code:"nl", name:"Nederlands (Dutch)", rtl:false},
            {code:"sv", name:"Svenska (Swedish)", rtl:false}, {code:"pl", name:"Polski (Polish)", rtl:false},
            {code:"uk", name:"Українська (Ukrainian)", rtl:false}, {code:"ro", name:"Română (Romanian)", rtl:false},
            {code:"el", name:"Ελληνικά (Greek)", rtl:false}, {code:"cs", name:"Čeština (Czech)", rtl:false},
            {code:"hu", name:"Magyar (Hungarian)", rtl:false}, {code:"id", name:"Bahasa Indonesia", rtl:false},
            {code:"th", name:"ไทย (Thai)", rtl:false}, {code:"vi", name:"Tiếng Việt (Vietnamese)", rtl:false},
            {code:"he", name:"עברית (Hebrew)", rtl:true}, {code:"da", name:"Dansk (Danish)", rtl:false},
            {code:"fi", name:"Suomi (Finnish)", rtl:false}, {code:"no", name:"Norsk (Norwegian)", rtl:false},
            {code:"sk", name:"Slovenčina (Slovak)", rtl:false}, {code:"bg", name:"Български (Bulgarian)", rtl:false},
            {code:"hr", name:"Hrvatski (Croatian)", rtl:false}, {code:"lt", name:"Lietuvių (Lithuanian)", rtl:false},
            {code:"sl", name:"Slovenščina (Slovenian)", rtl:false}, {code:"et", name:"Eesti (Estonian)", rtl:false},
            {code:"lv", name:"Latviešu (Latvian)", rtl:false}, {code:"ms", name:"Bahasa Melayu (Malay)", rtl:false},
            {code:"fil", name:"Filipino", rtl:false}, {code:"sw", name:"Kiswahili", rtl:false},
            {code:"sq", name:"Shqip (Albanian)", rtl:false}, {code:"az", name:"Azərbaycan (Azerbaijani)", rtl:false},
            {code:"bs", name:"Bosanski (Bosnian)", rtl:false}, {code:"ka", name:"ქართული (Georgian)", rtl:false},
            {code:"hy", name:"Հայերեն (Armenian)", rtl:false}, {code:"kk", name:"Қазақша (Kazakh)", rtl:false},
            {code:"uz", name:"Oʻzbekcha (Uzbek)", rtl:false}, {code:"mn", name:"Монгол (Mongolian)", rtl:false},
            {code:"bn", name:"বাংলা (Bengali)", rtl:false}, {code:"ta", name:"தமிழ் (Tamil)", rtl:false},
            {code:"te", name:"తెలుగు (Telugu)", rtl:false}, {code:"mr", name:"मराठी (Marathi)", rtl:false},
            {code:"gu", name:"ગુજરાતી (Gujarati)", rtl:false}, {code:"kn", name:"ಕನ್ನಡ (Kannada)", rtl:false},
            {code:"ml", name:"മലയാളം (Malayalam)", rtl:false}, {code:"pa", name:"ਪੰਜਾਬੀ (Punjabi)", rtl:false},
            {code:"si", name:"සිංහල (Sinhala)", rtl:false}, {code:"am", name:"አማርኛ (Amharic)", rtl:false},
            {code:"km", name:"ភាសាខ្មែរ (Khmer)", rtl:false}, {code:"lo", name:"ພາສາລາວ (Lao)", rtl:false},
            {code:"my", name:"မြန်မာဘာသာ (Burmese)", rtl:false}, {code:"ne", name:"नेपाली (Nepali)", rtl:false},
            {code:"af", name:"Afrikaans", rtl:false}, {code:"eu", name:"Euskara (Basque)", rtl:false},
            {code:"gl", name:"Galego (Galician)", rtl:false}, {code:"ca", name:"Català (Catalan)", rtl:false},
            {code:"is", name:"Íslenska (Icelandic)", rtl:false}, {code:"mt", name:"Malti (Maltese)", rtl:false},
            {code:"ga", name:"Gaeilge (Irish)", rtl:false}, {code:"cy", name:"Cymraeg (Welsh)", rtl:false}
        ];

        let currentAccount = JSON.parse(localStorage.getItem('mygram_current_account') || 'null');
        if (!currentAccount || !currentAccount.account) {
            currentAccount = {
                name: "Louay Chaghal",
                account: "louay@mygram.com",
                gender: "male",
                birthDate: "1995-01-01",
                age: 31,
                relation: "متزوج / متزوجة",
                hobbies: "البرمجة، تقنية المصاعد",
                family: "العائلة الكريمة",
                avatar: ""
            };
            localStorage.setItem('mygram_current_account', JSON.stringify(currentAccount));
        }

        let currentUser = currentAccount.name || 'Louay Chaghal';
        let userGender = currentAccount.gender || 'male';
        
        function calculateExactAge(birthdateStr) {
            if(!birthdateStr) return currentAccount.age || 25;
            const birthDate = new Date(birthdateStr);
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            return age;
        }

        let userAge = calculateExactAge(currentAccount.birthDate);
        let currentTab = 'feed';
        let activeChatPeer = null;
        let attachedMedia = '';

        function initApp() {
            const select = document.getElementById('appLangSelect');
            if(select) {
                select.innerHTML = globalLanguages.map(l => `<option value="${l.code}">${l.name}</option>`).join('');
                select.value = localStorage.getItem('mygram_lang') || 'ar';
            }
            renderAppContent();
        }

        function changeLanguage(code) {
            localStorage.setItem('mygram_lang', code);
            const langObj = globalLanguages.find(l => l.code === code) || globalLanguages[0];
            const htmlTag = document.getElementById('htmlRoot');
            if(htmlTag) {
                htmlTag.setAttribute('lang', code);
                htmlTag.setAttribute('dir', langObj.rtl ? 'rtl' : 'ltr');
            }
            showToast('تم تحديث لغة التطبيق بنجاح!');
            renderAppContent();
        }

        function showToast(msg) {
            const t = document.getElementById('toastMsg');
            if(!t) return;
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        function openSidebar() { document.getElementById("mySidebar").style.width = "270px"; }
        function closeSidebar() { document.getElementById("mySidebar").style.width = "0"; }

        function toggleThemeMode() {
            document.getElementById('pageBody').classList.toggle('light-mode');
            showToast('تم تغيير مظهر التطبيق بنجاح!');
        }

        function switchTab(tab, el) {
            if(el) {
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                el.classList.add('active');
            }
            currentTab = tab;
            activeChatPeer = null; // إعادة تعيين الشات عند التبديل
            renderAppContent();
        }

        function renderAppContent() {
            const area = document.getElementById('mainContentArea');
            if(!area) return;

            let userAvatarImg = currentAccount.avatar || '';
            let genderIcon = userGender === 'female' ? '👩' : '👨';

            if (currentTab === 'feed') {
                document.getElementById('appTitle').innerText = 'ماذا يدور الآن؟';
                area.innerHTML = `
                    <div class="stories-bar">
                        <div class="story-item" onclick="showToast('رفع قصة جديدة...')">
                            <div class="story-avatar-wrap">
                                <div class="story-avatar">${userAvatarImg ? `<img src="${userAvatarImg}" style="width:100%;height:100%;border-radius:50%;">` : genderIcon}</div>
                            </div>
                            <div class="story-name">قصتك +</div>
                        </div>
                        <div class="story-item" onclick="showToast('تصفح قصص العالم...')">
                            <div class="story-avatar-wrap"><div class="story-avatar">🌍</div></div>
                            <div class="story-name">Global News</div>
                        </div>
                    </div>

                    <div class="quick-bar">
                        <div class="quick-pill" onclick="switchTab('reels')">🎬 ريلز وشورتس</div>
                        <div class="quick-pill" onclick="switchTab('live')">🔴 بث مباشر <span class="live-badge" style="font-size:7px; padding:1px 3px;">LIVE</span></div>
                        <div class="quick-pill" onclick="switchTab('ads_manager')">📣 إعلان ممول</div>
                        <div class="quick-pill" onclick="switchTab('news')">🌐 أخبار العالم</div>
                    </div>

                    <div class="post-box">
                        <textarea id="postText" placeholder="بماذا تفكر؟ شارك أفكارك مع العالم..."></textarea>
                        <div id="mediaPreview"></div>
                        <div class="post-tools">
                            <label class="action-btn" style="cursor:pointer;">📷 الجاليري<input type="file" accept="image/*,video/*" style="display:none" onchange="handleAppMediaUpload(event)"></label>
                            <button class="action-btn" onclick="showToast('🎥 كاميرا مباشرة')">🎥 كاميرا</button>
                            <button class="action-btn" onclick="enhancePostWithAI()">✨ تحسين AI</button>
                            <label style="font-size:10px; margin-right:auto; cursor:pointer;"><input type="checkbox" id="sensitiveCheck"> +18</label>
                            <button class="action-btn btn-primary" onclick="publishAppPost()">نشر</button>
                        </div>
                    </div>
                    <div id="postsContainer"></div>
                `;
                loadAppPosts();
            } else if (currentTab === 'reels') {
                document.getElementById('appTitle').innerText = 'MYGRAM Reels & Shorts';
                area.innerHTML = `
                    <div class="card-box" style="text-align:center; padding:35px 15px;">
                        <h3 style="color:var(--primary); margin-top:0;">🎬 الفيديوهات القصيرة (Reels & Shorts)</h3>
                        <p style="font-size:12px; color:var(--text-sub);">استعرض أحدث مقاطع الفيديو القصيرة التفاعلية حول العالم.</p>
                        <div style="background:var(--bg-main); height:320px; border-radius:14px; display:flex; justify-content:center; align-items:center; border:1px solid var(--border); margin-bottom:14px; font-size:45px;">
                            ▶️ [فيديو تجريبي ريلز]
                        </div>
                        <div style="display:flex; justify-content:space-around;">
                            <button class="action-btn" onclick="showToast('❤️ إعجاب بالريلز')">❤️ إعجاب</button>
                            <button class="action-btn" onclick="showToast('💬 فتح التعليقات')">💬 تعليق</button>
                            <button class="action-btn" onclick="showToast('🚀 تم مشاركة الفيديو!')">🚀 مشاركة</button>
                        </div>
                    </div>
                `;
            } else if (currentTab === 'live') {
                document.getElementById('appTitle').innerText = 'البث المباشر LIVE';
                area.innerHTML = `
                    <div class="card-box" style="text-align:center;">
                        <div style="display:flex; justify-content:center; align-items:center; gap:8px; margin-bottom:12px;">
                            <span class="live-badge">LIVE</span>
                            <h3 style="margin:0; font-size:14px; color:var(--primary);">استوديو البث المباشر العالمي</h3>
                        </div>
                        <div style="background:var(--bg-main); height:280px; border-radius:14px; display:flex; flex-direction:column; justify-content:center; align-items:center; border:1px solid var(--border); margin-bottom:14px;">
                            <div style="font-size:45px; margin-bottom:10px;">🎙️</div>
                            <p style="font-size:12px; color:var(--text-sub);">المذيع الحالي: ${currentUser}</p>
                        </div>
                        <button class="action-btn btn-primary" style="width:100%; justify-content:center; background:var(--live-red); color:#fff;" onclick="showToast('تم بدء البث المباشر بنجاح تام!')">🔴 ابدأ بثك المباشر الآن</button>
                    </div>
                `;
            } else if (currentTab === 'profile') {
                document.getElementById('appTitle').innerText = 'الملف الشخصي والبيانات';
                let relation = currentAccount.relation || 'أعزب / عزباء';
                let hobbies = currentAccount.hobbies || 'التقنية، السفر';
                let family = currentAccount.family || 'لا يوجد أقارب مضافين';
                let birthDateVal = currentAccount.birthDate || '2004-01-01';

                area.innerHTML = `
                    <div class="card-box" style="text-align:center;">
                        <div class="profile-avatar-big" style="width:100px; height:100px; border-radius:50%; border:3px solid var(--primary); margin:0 auto 10px; display:flex; justify-content:center; align-items:center; font-size:50px; background:var(--bg-main); overflow:hidden;">
                            ${userAvatarImg ? `<img src="${userAvatarImg}" style="width:100%;height:100%;object-fit:cover;">` : genderIcon}
                        </div>
                        <h3 style="margin:5px 0;">${currentUser}</h3>
                        <p style="font-size:11px; color:var(--text-sub); margin-bottom:15px;">الحساب: ${currentAccount.account || ''} | العمر: ${userAge} سنة</p>

                        <div class="info-row"><span>الجندر (الهوية):</span> <b>${userGender === 'female' ? 'أنثى 👩' : 'ذكر 👨'}</b></div>
                        <div class="info-row"><span>الحالة الاجتماعية:</span> <b>${relation}</b></div>
                        <div class="info-row"><span>أفراد العائلة:</span> <b>${family}</b></div>
                        <div class="info-row"><span>الهوايات:</span> <b>${hobbies}</b></div>

                        <hr style="border:0; border-top:1px solid var(--border); margin:15px 0;">
                        
                        <h4 style="margin:0 0 10px; color:var(--primary); font-size:12px; text-align:right;">تعديل البيانات الشخصية:</h4>
                        
                        <label class="edit-label">تاريخ الميلاد:</label>
                        <input type="date" id="editBirthDate" value="${birthDateVal}">

                        <label class="edit-label">الجندر (الهوية):</label>
                        <select id="editGender">
                            <option value="male" ${userGender === 'male' ? 'selected' : ''}>ذكر 👨</option>
                            <option value="female" ${userGender === 'female' ? 'selected' : ''}>أنثى 👩</option>
                        </select>

                        <label class="edit-label">الحالة الاجتماعية:</label>
                        <select id="editRelation">
                            <option value="أعزب / عزباء" ${relation === 'أعزب / عزباء' ? 'selected' : ''}>أعزب / عزباء</option>
                            <option value="مرتبط / مرتبطة" ${relation === 'مرتبط / مرتبطة' ? 'selected' : ''}>مرتبط / مرتبطة</option>
                            <option value="متزوج / متزوجة" ${relation === 'متزوج / متزوجة' ? 'selected' : ''}>متزوج / متزوجة</option>
                        </select>

                        <label class="edit-label">الهوايات والاهتمامات:</label>
                        <input type="text" id="editHobbies" value="${hobbies}">

                        <label class="edit-label">أفراد العائلة:</label>
                        <input type="text" id="editFamily" value="${family}">

                        <label class="action-btn" style="width:100%; justify-content:center; margin-bottom:10px; cursor:pointer; margin-top:10px;">
                            🖼️ تحميل / تغيير صورة البروفايل
                            <input type="file" accept="image/*" style="display:none" onchange="uploadAppAvatar(event)">
                        </label>
                        <button class="action-btn btn-primary" onclick="saveAppProfileDetails()" style="width:100%; justify-content:center;">حفظ كافة التعديلات</button>
                    </div>
                `;
            } else if (currentTab === 'accounts') {
                document.getElementById('appTitle').innerText = 'إدارة الحسابات';
                let accounts = JSON.parse(localStorage.getItem('mygram_all_accounts') || '[]');
                let accHtml = '';
                accounts.forEach(acc => {
                    let activeIndicator = (acc.account === currentAccount.account) ? ' (الحساب النشط حالياً)' : '';
                    accHtml += `
                        <div class="group-item" style="cursor:pointer;" onclick="switchAppAccount('${acc.account}')">
                            <span class="group-name">👤 ${acc.name} (${acc.account})${activeIndicator}</span>
                            <button class="action-btn btn-primary">تبديل</button>
                        </div>
                    `;
                });
                area.innerHTML = `
                    <div class="card-box">
                        <h3 style="color:var(--primary); margin-top:0;">🔄 الحسابات المسجلة على الجهاز</h3>
                        <p style="font-size:11px; color:var(--text-sub);">التبديل الفوري بين حساباتك المحفوظة دون الحاجة لإعادة تسجيل الدخول:</p>
                        ${accHtml || '<p style="font-size:12px;">لا توجد حسابات أخرى محفوظة.</p>'}
                        <button class="action-btn" style="width:100%; justify-content:center; margin-top:12px;" onclick="logoutApp()">+ تسجيل خروج / العودة للرئيسية</button>
                    </div>
                `;
            } else if (currentTab === 'chats') {
                document.getElementById('appTitle').innerText = 'MYGRAM CHAT (WhatsApp Style)';
                
                if (!activeChatPeer) {
                    // واجهة قائمة جهات الاتصال على شكل واتساب
                    area.innerHTML = `
                        <div class="card-box" style="padding: 12px;">
                            <input type="text" id="searchChatInput" placeholder="🔍 ابحث في جهات الاتصال أو رقم هاتف..." style="margin-bottom: 10px;">
                            <div style="font-size:11px; color:var(--text-sub); margin-bottom:8px; font-weight:bold;">جهات الاتصال والرسائل الأخيرة:</div>
                            
                            <div class="wa-chat-item" onclick="openChat('فاست ليفت - دمشق', '+963 932 557 593', '🏢')">
                                <div class="wa-avatar">🏢</div>
                                <div class="wa-info">
                                    <div class="wa-top-row">
                                        <span class="wa-name">+963 932 557 593</span>
                                        <span class="wa-time">اليوم</span>
                                    </div>
                                    <div class="wa-msg">أهلاً بك، تفضل كيف يمكنني مساعدتك في أعمال المصاعد؟</div>
                                </div>
                            </div>

                            <div class="wa-chat-item" onclick="openChat('الدعم الفني العالمي', '+20 10 06600998', '🛠️')">
                                <div class="wa-avatar">🛠️</div>
                                <div class="wa-info">
                                    <div class="wa-top-row">
                                        <span class="wa-name">+20 10 06600998</span>
                                        <span class="wa-time">أمس</span>
                                    </div>
                                    <div class="wa-msg">تم استلام طلب الصيانة الخاص بالمنظومة بنجاح.</div>
                                </div>
                            </div>

                            <div class="wa-chat-item" onclick="openChat('مجموعة مهندسي المصاعد', '+963 940 905 077', '👥')">
                                <div class="wa-avatar">👥</div>
                                <div class="wa-info">
                                    <div class="wa-top-row">
                                        <span class="wa-name">+963 940 905 077</span>
                                        <span class="wa-time">19/10/2026</span>
                                    </div>
                                    <div class="wa-msg">ممكن رد للتأكيد أو إلغاء طلب المكونات البرمجية؟</div>
                                </div>
                            </div>

                            <div class="wa-chat-item" onclick="openChat('مكتب الإدارة والمشاريع', '+966 57 379 5614', '📁')">
                                <div class="wa-avatar">📁</div>
                                <div class="wa-info">
                                    <div class="wa-top-row">
                                        <span class="wa-name">+966 57 379 5614</span>
                                        <span class="wa-time">16/10/2026</span>
                                    </div>
                                    <div class="wa-msg">مرحباً! هل يمكنني الحصول على مزيد من العروض؟</div>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    // واجهة المحادثة الفردية الخاصة بـ واتساب
                    area.innerHTML = `
                        <div class="card-box chat-container">
                            <div style="display:flex; align-items:center; gap:10px; padding-bottom:10px; border-bottom:1px solid var(--border); margin-bottom:10px;">
                                <button class="action-btn" onclick="activeChatPeer=null; renderAppContent();">⬅ رجوع</button>
                                <div style="width:36px; height:36px; border-radius:50%; background:var(--bg-main); display:flex; justify-content:center; align-items:center; font-size:18px;">${activeChatPeer.icon}</div>
                                <div>
                                    <div style="font-weight:bold; font-size:13px; color:var(--primary);">${activeChatPeer.name}</div>
                                    <div style="font-size:10px; color:var(--text-sub);">${activeChatPeer.phone}</div>
                                </div>
                            </div>

                            <div class="chat-messages" id="waMessagesBox">
                                <div class="chat-msg peer">مرحباً بك، نحن متواجدون الآن للرد على كافة استفساراتك عبر MYGRAM CHAT.</div>
                            </div>

                            <div style="display:flex; gap:8px;">
                                <input type="text" id="waChatInput" placeholder="اكتب رسالة..." style="flex:1; margin-bottom:0;">
                                <button class="action-btn btn-primary" onclick="sendWhatsAppMessage()">إرسال</button>
                            </div>
                        </div>
                    `;
                }
            } else if (currentTab === 'create_page') {
                document.getElementById('appTitle').innerText = 'إنشاء صفحة جديدة';
                area.innerHTML = `
                    <div class="card-box">
                        <h3 style="color:var(--primary); margin-top:0;">📄 إنشاء صفحة عامة / تجارية</h3>
                        <input type="text" id="pageName" placeholder="اسم الصفحة التجارية أو العامة...">
                        <textarea placeholder="وصف الصفحة والنشاط..."></textarea>
                        <button class="action-btn btn-primary" style="width:100%; justify-content:center;" onclick="showToast('تم إنشاء الصفحة بنجاح!'); switchTab('feed');">إنشاء الصفحة</button>
                    </div>
                `;
            } else if (currentTab === 'create_group') {
                document.getElementById('appTitle').innerText = 'إنشاء مجموعة جديدة';
                area.innerHTML = `
                    <div class="card-box">
                        <h3 style="color:var(--primary); margin-top:0;">👥 إنشاء مجموعة مجتمعية</h3>
                        <input type="text" id="groupName" placeholder="اسم المجموعة...">
                        <select><option>عامة (يمكن للجميع الانضمام)</option><option>خاصة</option></select>
                        <button class="action-btn btn-primary" style="width:100%; justify-content:center;" onclick="showToast('تم إنشاء المجموعة بنجاح!'); switchTab('feed');">إنشاء المجموعة</button>
                    </div>
                `;
            } else if (currentTab === 'ai') {
                document.getElementById('appTitle').innerText = 'المساعد الذكي AI';
                area.innerHTML = `
                    <div class="card-box chat-container">
                        <h3 style="color:var(--primary); margin-top:0; font-size:14px;">مساعد MYGRAM الذكي الشامل</h3>
                        <div class="chat-messages" id="aiMessagesBox">
                            <div class="chat-msg peer">أهلاً بك يا ${currentUser}! أنا عقلك الذكي المساعد. كيف أمكنني خدمتك اليوم؟</div>
                        </div>
                        <div style="display:flex; gap:8px;">
                            <input type="text" id="aiInput" placeholder="اكتب سؤالك للذكاء الاصطناعي..." style="flex:1; margin-bottom:0;">
                            <button class="action-btn btn-primary" onclick="sendAiMessageQuery()">إرسال</button>
                        </div>
                    </div>
                `;
            } else if (currentTab === 'ads_manager') {
                document.getElementById('appTitle').innerText = 'مدير الإعلانات الممولة';
                area.innerHTML = `
                    <div class="card-box">
                        <h3 style="color:var(--ad-gold); margin-top:0;">📣 إطلاق إعلان ممول جديد (MYGRAM Ads)</h3>
                        <input type="text" id="adTitle" placeholder="عنوان الحملة أو النشاط التجاري...">
                        <textarea id="adText" placeholder="نص الإعلان الممول..."></textarea>
                        <button class="action-btn btn-primary" style="width:100%; justify-content:center; background:var(--ad-gold); color:#050b14;" onclick="launchSponsoredAdCampaign()">🚀 إطلاق الإعلان الممول</button>
                    </div>
                `;
            } else if (currentTab === 'news') {
                document.getElementById('appTitle').innerText = 'MYGRAM NEWS';
                area.innerHTML = `
                    <div class="card-box">
                        <h3 style="color:var(--primary); margin-top:0; font-size:14px;">🌐 الأخبار العالمية والسياسية والاقتصادية المباشرة</h3>
                        <div class="group-item"><span class="group-name">📈 الأسواق العالمية تسجل مؤشرات إيجابية متقدمة.</span></div>
                        <div class="group-item"><span class="group-name">💻 تقنيات الذكاء الاصطناعي تشهد قفزات نوعية كبرى.</span></div>
                        <div class="group-item"><span class="group-name">🚀 إطلاق النسخة الأولى من منصة MYGRAM العالمية بنجاح.</span></div>
                    </div>
                `;
            }
        }

        function openChat(name, phone, icon) {
            activeChatPeer = { name, phone, icon };
            renderAppContent();
        }

        function sendWhatsAppMessage() {
            const input = document.getElementById('waChatInput');
            if(!input || !input.value.trim()) return;
            const box = document.getElementById('waMessagesBox');
            if(box) {
                box.innerHTML += `<div class="chat-msg user">${input.value}</div>`;
                input.value = '';
                box.scrollTop = box.scrollHeight;
                setTimeout(() => {
                    box.innerHTML += `<div class="chat-msg peer">تم استلام رسالتك وسيتم الرد قريباً.</div>`;
                    box.scrollTop = box.scrollHeight;
                }, 600);
            }
        }

        function switchAppAccount(accEmail) {
            let accounts = JSON.parse(localStorage.getItem('mygram_all_accounts') || '[]');
            let target = accounts.find(a => a.account === accEmail);
            if(target) {
                localStorage.setItem('mygram_current_account', JSON.stringify(target));
                currentAccount = target;
                currentUser = target.name;
                userGender = target.gender;
                userAge = calculateExactAge(target.birthDate);
                showToast('تم التبديل إلى الحساب بنجاح!');
                renderAppContent();
            }
        }

        function launchSponsoredAdCampaign() {
            const title = document.getElementById('adTitle').value.trim();
            const text = document.getElementById('adText').value.trim();
            if(!title || !text) { showToast('أدخل عنوان الإعلان والنص!'); return; }
            let posts = JSON.parse(localStorage.getItem('mygram_posts') || '[]');
            posts.unshift({ id: Date.now(), author: title, isSponsored: true, content: text, likes: 0, views: 1 });
            localStorage.setItem('mygram_posts', JSON.stringify(posts));
            showToast('تم إطلاق الإعلان الممول بنجاح!');
            switchTab('feed');
        }

        function uploadAppAvatar(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                currentAccount.avatar = evt.target.result;
                localStorage.setItem('mygram_current_account', JSON.stringify(currentAccount));
                
                let accounts = JSON.parse(localStorage.getItem('mygram_all_accounts') || '[]');
                accounts = accounts.map(a => a.account === currentAccount.account ? currentAccount : a);
                localStorage.setItem('mygram_all_accounts', JSON.stringify(accounts));

                showToast('تم تحديث الصورة الشخصية بنجاح!');
                renderAppContent();
            };
            reader.readAsDataURL(file);
        }

        function saveAppProfileDetails() {
            let newBirthDate = document.getElementById('editBirthDate').value;
            let newGender = document.getElementById('editGender').value;
            let newRelation = document.getElementById('editRelation').value;
            let hobbies = document.getElementById('editHobbies').value.trim();
            let family = document.getElementById('editFamily').value.trim();
            
            if(newBirthDate) {
                const exactAge = calculateExactAge(newBirthDate);
                if(exactAge < 16) { showToast('عذراً، يجب ألا يقل العمر عن 16 عاماً!'); return; }
                currentAccount.birthDate = newBirthDate;
                currentAccount.age = exactAge;
                userAge = exactAge;
            }
            if(newGender) {
                currentAccount.gender = newGender;
                userGender = newGender;
            }
            if(newRelation) currentAccount.relation = newRelation;
            if(hobbies) currentAccount.hobbies = hobbies;
            if(family) currentAccount.family = family;
            
            localStorage.setItem('mygram_current_account', JSON.stringify(currentAccount));
            let accounts = JSON.parse(localStorage.getItem('mygram_all_accounts') || '[]');
            accounts = accounts.map(a => a.account === currentAccount.account ? currentAccount : a);
            localStorage.setItem('mygram_all_accounts', JSON.stringify(accounts));

            showToast('تم حفظ كافة التعديلات بنجاح تام!');
            renderAppContent();
        }

        function handleAppMediaUpload(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                attachedMedia = evt.target.result;
                document.getElementById('mediaPreview').innerHTML = `<img src="${attachedMedia}" class="post-image" style="width:100%; max-height:350px; object-fit:cover; border-radius:10px; margin-top:8px;">`;
            };
            reader.readAsDataURL(file);
        }

        function enhancePostWithAI() {
            const input = document.getElementById('postText');
            if(!input.value.trim()) { showToast('اكتب نصاً أولاً!'); return; }
            input.value = "✨ " + input.value + " 🚀 #MYGRAM";
            showToast('تم تحسين النص بالـ AI!');
        }

        function publishAppPost() {
            const text = document.getElementById('postText').value;
            const isSens = document.getElementById('sensitiveCheck') ? document.getElementById('sensitiveCheck').checked : false;
            if(!text.trim() && !attachedMedia) return;

            let posts = JSON.parse(localStorage.getItem('mygram_posts') || '[]');
            posts.unshift({ id: Date.now(), author: currentUser, content: text, image: attachedMedia, sensitive: isSens, likes: 0, views: 1 });
            localStorage.setItem('mygram_posts', JSON.stringify(posts));

            attachedMedia = '';
            document.getElementById('postText').value = '';
            showToast('تم النشر بنجاح!');
            loadAppPosts();
        }

        function loadAppPosts() {
            let posts = JSON.parse(localStorage.getItem('mygram_posts') || '[]');
            const container = document.getElementById('postsContainer');
            if(!container) return;
            let html = '';
            let genderIcon = userGender === 'female' ? '👩' : '👨';
            let userAvatarImg = currentAccount.avatar || '';

            posts.forEach((p, idx) => {
                let sponsoredTag = p.isSponsored ? `<span class="sponsored-tag">ممول / Sponsored 📣</span>` : '';
                let mediaHtml = '';
                if (p.image) {
                    if (p.sensitive) {
                        mediaHtml = `
                            <div class="post-image-container" style="position:relative; overflow:hidden; border-radius:10px; margin-top:8px;">
                                <img src="${p.image}" class="post-image media-blur" id="img_${idx}" style="width:100%; max-height:350px; object-fit:cover; display:block; filter:blur(25px);">
                                <div class="sensitive-overlay" id="overlay_${idx}" style="position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; flex-direction:column; justify-content:center; align-items:center; color:#fff; text-align:center; padding:15px; box-sizing:border-box;">
                                    <div style="font-size:12px; margin-bottom:6px;">⚠️ محتوى حساس (+18)</div>
                                    <button class="action-btn btn-primary" onclick="revealPostMedia(${idx})">عرض المحتوى</button>
                                </div>
                            </div>
                        `;
                    } else {
                        mediaHtml = `<img src="${p.image}" class="post-image" style="width:100%; max-height:350px; object-fit:cover; border-radius:10px; margin-top:8px;">`;
                    }
                }

                html += `
                    <div class="post-card">
                        <div class="post-author-row">
                            <div class="avatar-container" style="position:relative; width:40px; height:40px;">
                                <div class="mini-avatar" style="width:100%; height:100%; border-radius:50%; object-fit:cover; border:2px solid var(--primary); background:var(--bg-main); display:flex; justify-content:center; align-items:center; font-size:20px;">${userAvatarImg ? `<img src="${userAvatarImg}" style="width:100%;height:100%;border-radius:50%;">` : genderIcon}</div>
                                <div class="online-dot" style="position:absolute; bottom:0; right:0; width:9px; height:9px; background:var(--online-green); border-radius:50%; border:1.5px solid var(--card-bg);"></div>
                            </div>
                            <div class="post-author-info" style="flex:1; font-weight:bold; color:var(--primary); font-size:13px;">${p.author} ${sponsoredTag}</div>
                        </div>
                        <div class="post-text">${p.content}</div>
                        ${mediaHtml}
                        <div class="post-actions">
                            <span class="action-item" onclick="likeAppPost(${idx})">❤️ إعجاب (${p.likes || 0})</span>
                            <span class="action-item" onclick="showToast('تم نسخ رابط المنشور بنجاح!')">🚀 مشاركة</span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function revealPostMedia(idx) {
            if (userAge < 18) {
                showToast('محتوى +18 محظور لمن هم أقل من 18 سنة!');
                return;
            }
            document.getElementById(`img_${idx}`).style.filter = 'none';
            document.getElementById(`overlay_${idx}`).style.display = 'none';
        }

        function likeAppPost(idx) {
            let posts = JSON.parse(localStorage.getItem('mygram_posts') || '[]');
            posts[idx].likes = (posts[idx].likes || 0) + 1;
            localStorage.setItem('mygram_posts', JSON.stringify(posts));
            loadAppPosts();
        }

        function sendAiMessageQuery() {
            const input = document.getElementById('aiInput');
            if(!input || !input.value.trim()) return;
            const box = document.getElementById('aiMessagesBox');
            if(box) {
                box.innerHTML += `<div class="chat-msg user">${input.value}</div>`;
                input.value = '';
                box.scrollTop = box.scrollHeight;
                setTimeout(() => {
                    box.innerHTML += `<div class="chat-msg peer">المساعد AI: تم استلام استفسارك ومعالجته بنجاح تام!</div>`;
                    box.scrollTop = box.scrollHeight;
                }, 500);
            }
        }

        function logoutApp() {
            localStorage.removeItem('mygram_is_logged');
            localStorage.removeItem('mygram_current_account');
            window.location.href = 'index.html';
        }

        window.onload = function() {
            initApp();
        };
    </script>
</body>
</html>
