<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYGRAM - المنصة الذكية</title>
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: #111827;
            --border-color: #1f2937;
            --accent: #38bdf8;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        
        /* شريط التنقل العلوي الاحترافي */
        header { background: rgba(17, 24, 39, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color); position: fixed; top: 0; width: 100%; height: 65px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 1000; }
        .logo { font-size: 20px; font-weight: 900; color: var(--accent); letter-spacing: 0.5px; }
        
        /* حاوية المحتوى الأساسية */
        main { max-width: 650px; margin: 85px auto 80px; padding: 0 15px; width: 100%; flex: 1; }
        
        /* بطاقات التصميم النظيفة */
        .app-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
        .app-card h2 { font-size: 16px; font-weight: 700; margin-bottom: 12px; color: var(--accent); }
        
        textarea { width: 100%; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 12px; padding: 14px; font-size: 14px; resize: none; min-height: 90px; outline: none; transition: 0.2s; }
        textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }
        
        .btn-primary { background-color: var(--accent); color: #030712; border: none; font-weight: 800; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }

        /* شريط التنقل السفلي الحديث */
        nav { background: rgba(17, 24, 39, 0.9); backdrop-filter: blur(10px); border-top: 1px solid var(--border-color); position: fixed; bottom: 0; width: 100%; height: 70px; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-item { color: var(--text-muted); font-size: 12px; text-align: center; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .nav-item.active { color: var(--accent); font-weight: 800; }
    </style>
</head>
<body>

    <header>
        <div class="logo">MYGRAM</div>
        <div style="font-size: 12px; color: var(--text-muted);">النسخة الأساسية المتينة</div>
    </header>

    <main>
        <div class="app-card">
            <h2>إدارة المحتوى الأساسي</h2>
            <textarea placeholder="اكتب فكرتك أو مشروعك هنا بهدوء..."></textarea>
            <div style="display: flex; justify-content: flex-end; margin-top: 12px;">
                <button class="btn-primary" onclick="alert('تمت العملية بنجاح')">اعتماد النشر</button>
            </div>
        </div>

        <div class="app-card">
            <h2>سجل العمليات والأساسيات</h2>
            <p style="font-size: 13px; color: var(--text-muted); line-height: 1.6;">
                هذا التصميم يعتمد على قواعد نظيفة جداً (Clean Code)، بدون تضخم، وبدون أي عناصر عشوائية تسبب الإحراج أمام أي مستخدم أو مستثمر.
            </p>
        </div>
    </main>

    <nav>
        <div class="nav-item active">الرئيسية</div>
        <div class="nav-item">الإحصائيات</div>
        <div class="nav-item">الرسائل</div>
        <div class="nav-item">الملف الشخصي</div>
    </nav>

    <script>
        // تفاعل بسيط ونظيف لتأكيد استجابة الأزرار
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
            });
        });
    </script>
</body>
</html>
