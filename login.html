<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#087cf0"><title>تسجيل الدخول | MYGRAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
body.login-page{min-height:100vh;background:radial-gradient(ellipse at 15% 15%,#dceeff 0,transparent 38%),radial-gradient(ellipse at 90% 90%,#e8e4ff 0,transparent 36%),#f5f8fd;display:grid;place-items:center;padding:24px}
.login-shell{width:min(100%,1000px);min-height:600px;display:grid;grid-template-columns:1fr 1fr;background:#fff;border:1px solid #e4edf8;border-radius:30px;overflow:hidden;box-shadow:0 28px 80px #173b6818}
.login-art{background:linear-gradient(145deg,#0068d9,#1188f5 62%,#6ec3ff);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-art:before,.login-art:after{content:"";position:absolute;border:1px solid #ffffff35;border-radius:50%;width:370px;height:370px;left:-120px;bottom:-110px;box-shadow:0 0 0 35px #ffffff0a,0 0 0 75px #ffffff0a}
.login-art:after{width:180px;height:180px;left:auto;right:-70px;top:-60px;bottom:auto}
.login-brand{display:flex;align-items:center;gap:12px;font-size:26px;font-weight:900;position:relative;z-index:1}
.login-brand .brand-symbol{background:#ffffff25;box-shadow:none;border:1px solid #ffffff55}
.login-art h1{font-size:38px;line-height:1.45;margin:0 0 14px;position:relative;z-index:1}
.login-art p{font-size:15px;line-height:2;color:#e6f4ff;max-width:340px;position:relative;z-index:1}
.login-art .login-foot{font-size:12px;color:#d5ebff;position:relative;z-index:1}
.login-panel{padding:54px clamp(25px,5vw,62px);display:flex;flex-direction:column;justify-content:center}
.login-panel h2{font-size:27px;margin:0 0 6px;font-weight:900}
.login-subtitle{color:#78869b;margin:0 0 28px;line-height:1.9}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:#f0f5fb;padding:5px;border-radius:13px;margin-bottom:22px;gap:5px}
.auth-tabs button{border:0;background:transparent;color:#75849a;padding:11px;border-radius:10px;font-weight:800}
.auth-tabs button.active{background:#fff;color:#087cf0;box-shadow:0 3px 12px #183c6410}
.login-panel label{display:flex;flex-direction:column;gap:8px;margin:12px 0;color:#52637a;font-weight:700;font-size:12px}
.login-panel input{width:100%;border:1px solid #dfe8f3;border-radius:12px;padding:13px 14px;background:#fbfdff;outline:0;direction:ltr;text-align:left;font-size:14px;transition:border-color .2s,box-shadow .2s}
.login-panel input:focus{border-color:#65b2ff;box-shadow:0 0 0 4px #087cf014}
.login-panel .primary-btn{width:100%;padding:13px;margin-top:15px;font-size:14px}
.login-panel .notice{min-height:24px;margin:14px 0 0;font-size:12px;line-height:1.8}
.notice.error{color:#d43f58}.notice.success{color:#10865d}
.login-panel .login-small{font-size:11px;color:#8a98aa;text-align:center;margin-top:20px}
.login-panel [hidden],.login-panel .hidden{display:none!important}
@media(max-width:720px){body.login-page{padding:12px}.login-shell{grid-template-columns:1fr;min-height:0;border-radius:22px;max-width:460px}.login-art{padding:22px 25px;min-height:175px}.login-art h1{font-size:24px;margin-top:24px}.login-art p{font-size:12px;margin:0}.login-art .login-foot{display:none}.login-panel{padding:28px 24px 32px}.login-panel h2{font-size:23px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="config.js"></script><script defer src="auth.js"></script>
<script defer src="language.js"></script>
</head>
<body class="login-page">
<main class="login-shell">
<section class="login-art"><div class="login-brand"><span class="brand-symbol"><img src="logo.svg" alt="MYGRAM" class="brand-icon"></span><span>MYGRAM</span></div><div><h1>عالمك، قصتك.<br>ومكانك بين أصدقائك 💙</h1><p>شارك لحظاتك، اكتشف أشخاصاً يشبهونك، وخلي التواصل أقرب وأسهل.</p></div><div class="login-foot">مجتمع يجمعنا، وقصص تستحق أن تُروى.</div></section>
<section class="login-panel">
<h2 id="formTitle">أهلاً بعودتك 👋</h2><p class="login-subtitle" id="formSubtitle">سجّل الدخول للمتابعة إلى MYGRAM.</p>
<div class="auth-tabs"><button id="loginTab" class="active" type="button">تسجيل الدخول</button><button id="signupTab" type="button">إنشاء حساب</button></div>
<form id="authForm">
<label id="nameLabel" class="hidden">الاسم الظاهر<input id="fullName" name="fullName" autocomplete="name" placeholder="كيف نناديك؟"></label>
<label>البريد الإلكتروني<input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required></label>
<label>كلمة المرور<input id="password" name="password" type="password" autocomplete="current-password" minlength="6" placeholder="6 أحرف على الأقل" required></label>
<button class="primary-btn" id="submitButton" type="submit">تسجيل الدخول</button><p class="notice" id="authNotice" role="status" aria-live="polite"></p>
</form><p class="login-small">بتسجيل الدخول، أنت جاهز للانضمام إلى مجتمع MYGRAM.</p>
</section></main><span id="year" hidden></span>
</body></html>
