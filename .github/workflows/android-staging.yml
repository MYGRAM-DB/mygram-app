name: MYGRAM Android Staging Bootstrap

on:
  pull_request:
    branches: ["rebuild/phase-a-architecture"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mygram-android-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-bootstrap:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature/android-staging') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.ref == 'feature/android-staging' &&
       github.event.pull_request.base.ref == 'rebuild/phase-a-architecture')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout Android staging branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform, build tools, emulator and test image
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Validate Staging-only build inputs
        shell: bash
        env:
          VITE_SUPABASE_URL: https://cbyvtehvaojxfcgpelir.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_cBsp8a-ePFL_0KWebtS0sw_xuayxMjm
        run: |
          set -euo pipefail
          test "${VITE_SUPABASE_URL}" = "https://cbyvtehvaojxfcgpelir.supabase.co" || {
            echo "::error::VITE_SUPABASE_URL must point to MYGRAM-STAGING."
            exit 1
          }
          case "${VITE_SUPABASE_PUBLISHABLE_KEY}" in
            sb_publishable_*) ;;
            *) echo "::error::Missing or invalid Supabase publishable key."; exit 1 ;;
          esac
          echo "Staging project reference validated."

      - name: Install committed web dependencies
        run: npm ci --no-audit --no-fund

      - name: Resolve and pin Capacitor 8 packages
        run: npm install --save-exact @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/app@8 --no-audit --no-fund

      - name: Typecheck and build local Android web assets
        env:
          VITE_SUPABASE_URL: https://cbyvtehvaojxfcgpelir.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_cBsp8a-ePFL_0KWebtS0sw_xuayxMjm
        run: |
          set -euo pipefail
          npm run typecheck
          npx vite build --mode android

      - name: Generate native Android project
        run: |
          set -euo pipefail
          npx cap add android
          npx cap sync android
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          if 'android:allowBackup="true"' not in source:
              raise SystemExit("Expected generated Android backup setting was not found; refusing to continue.")
          manifest.write_text(source.replace('android:allowBackup="true"', 'android:allowBackup="false"', 1))
          PY
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK identity, signature, permissions, target and checksum
        shell: bash
        env:
          APK: android/app/build/outputs/apk/debug/app-debug.apk
        run: |
          set -euo pipefail
          test -s "$APK"
          SDK_TOOLS="$ANDROID_HOME/build-tools"
          APKSIGNER="$(find "$SDK_TOOLS" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$SDK_TOOLS" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='com.mygram.app.staging'"
          PERMISSIONS="$("$AAPT" dump permissions "$APK")"
          if printf '%s\n' "$PERMISSIONS" | grep -E 'android.permission.(CAMERA|RECORD_AUDIO|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|READ_CONTACTS|WRITE_CONTACTS)'; then
            echo "::error::Unexpected sensitive Android permission found."
            exit 1
          fi
          if grep -R -a -E 'sb_secret_[A-Za-z0-9_-]{20,}' android/app/src/main/assets/public; then
            echo "::error::Supabase secret-key pattern found in bundled assets."
            exit 1
          fi
          if grep -R -a -E 'rocztskcyakvekokftfx' android/app/src/main/assets/public; then
            echo "::error::Production Supabase project reference found in Android assets."
            exit 1
          fi
          grep -R -a -q 'cbyvtehvaojxfcgpelir' android/app/src/main/assets/public
          BADGING_LINE="$(printf '%s\n' "$BADGING" | grep -F "package: name='com.mygram.app.staging'")"
          printf '%s\n' "$BADGING_LINE"
          MIN_SDK="$(printf '%s\n' "$BADGING" | sed -n "s/.*sdkVersion:'\\([^']*\\)'.*/\\1/p")"
          TARGET_SDK="$(printf '%s\n' "$BADGING" | sed -n "s/.*targetSdkVersion:'\\([^']*\\)'.*/\\1/p")"
          test -n "$MIN_SDK"
          test -n "$TARGET_SDK"
          mkdir -p artifacts
          cp "$APK" artifacts/mygram-staging-debug.apk
          sha256sum artifacts/mygram-staging-debug.apk > artifacts/SHA256SUMS.txt
          {
            echo "commit_sha=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "package=com.mygram.app.staging"
            echo "version_code=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p")"
            echo "version_name=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p")"
            echo "min_sdk=$MIN_SDK"
            echo "target_sdk=$TARGET_SDK"
            echo "signing=ephemeral Android debug key"
            echo "backend=MYGRAM-STAGING"
          } > artifacts/build-info.txt
          echo "APK built, signature and Staging identity verified; ready for emulator smoke test."

      - name: Boot Android 15 emulator and smoke-test APK
        shell: bash
        run: |
          set -euo pipefail
          echo "no" | avdmanager create avd -n mygram-api35 -k "system-images;android-35;google_apis;x86_64" -d pixel_2 --force
          emulator -avd mygram-api35 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data > /tmp/mygram-emulator.log 2>&1 &
          adb wait-for-device
          for attempt in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              cat /tmp/mygram-emulator.log
              echo "::error::Android emulator did not finish booting."
              exit 1
            fi
            sleep 5
          done
          adb install artifacts/mygram-staging-debug.apk
          adb logcat -c
          adb shell monkey -p com.mygram.app.staging 1
          sleep 12
          adb shell pidof com.mygram.app.staging
          if adb logcat -d -t 5000 | grep -E "FATAL EXCEPTION|Process: com\\.mygram\\.app\\.staging" ; then
            echo "::error::Android app crashed during emulator smoke test."
            exit 1
          fi
          echo "Android 15 emulator installed and launched MYGRAM STAGING successfully."

      - name: Package generated Android source for review
        run: |
          set -euo pipefail
          rm -rf android/app/build android/build android/.gradle
          rm -rf android/capacitor-cordova-android-plugins
          rm -rf android/app/src/main/assets/public
          rm -f android/app/src/main/assets/capacitor.config.json
          rm -f android/app/src/main/assets/capacitor.plugins.json
          rm -f android/app/src/main/res/xml/config.xml
          find android -name local.properties -delete
          zip -qr android-source-review.zip android capacitor.config.json package.json package-lock.json
          unzip -l android-source-review.zip | tail -n 5

      - name: Upload installable APK and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: mygram-android-staging-apk-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload generated Android source for review
        uses: actions/upload-artifact@v4
        with:
          name: mygram-android-staging-source-${{ github.sha }}
          path: android-source-review.zip
          if-no-files-found: error
          retention-days: 7
