name: Build MYGRAM WebApp Package (Manual Legacy)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Install test dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests before packaging
        run: npm run test:e2e

      - name: Create complete WebApp source package
        run: |
          zip -r mygram-app.zip index.html home.html people.html profile.html services.html *.js *.css *.svg README-AR.md VERSION.txt

      - name: Upload WebApp source package
        uses: actions/upload-artifact@v4
        with:
          name: MYGRAM-WebApp-Source
          path: mygram-app.zip
          if-no-files-found: error
