name: Build Android WebApp Package

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Create Web Package
      run: |
        zip -r mygram-app.zip index.html

    - name: Upload Package
      uses: actions/upload-artifact@v4
      with:
        name: MYGRAM-Web-APK-Source
        path: mygram-app.zip
