name: MYGRAM fb workshop CI
on:
  push:
    branches: ["feature/workshop-fb"]
  pull_request:
    branches: ["rebuild/phase-a-architecture"]
permissions:
  contents: read
concurrency:
  group: workshop-fb-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/workshops/fb.test.mjs
      - run: npm run build
