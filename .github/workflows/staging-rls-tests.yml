name: MYGRAM Staging RLS tests

on:
  workflow_dispatch:
  push:
    branches: [staging-rls-bootstrap]
    paths:
      - 'tests/staging-rls.spec.js'
      - '.github/workflows/staging-rls-tests.yml'
      - 'package.json'
      - 'playwright.config.js'

permissions:
  contents: read

jobs:
  staging-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://cbyvtehvaojxfcgpelir.supabase.co
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      MYGRAM_TEST_USER_A_EMAIL: ${{ secrets.MYGRAM_TEST_USER_A_EMAIL }}
      MYGRAM_TEST_USER_A_PASSWORD: ${{ secrets.MYGRAM_TEST_USER_A_PASSWORD }}
      MYGRAM_TEST_USER_B_EMAIL: ${{ secrets.MYGRAM_TEST_USER_B_EMAIL }}
      MYGRAM_TEST_USER_B_PASSWORD: ${{ secrets.MYGRAM_TEST_USER_B_PASSWORD }}
      MYGRAM_TEST_USER_C_EMAIL: ${{ secrets.MYGRAM_TEST_USER_C_EMAIL }}
      MYGRAM_TEST_USER_C_PASSWORD: ${{ secrets.MYGRAM_TEST_USER_C_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate Staging endpoint and required secrets
        run: |
          node <<'NODE'
          const expected = "https://cbyvtehvaojxfcgpelir.supabase.co";
          const raw = process.env.SUPABASE_URL || "";
          let parsed;
          try { parsed = new URL(raw); } catch { throw new Error("SUPABASE_URL is not a valid absolute URL"); }
          if (raw !== expected || parsed.origin !== expected || parsed.pathname !== "/" || parsed.search || parsed.hash) throw new Error("SUPABASE_URL must exactly match the MYGRAM-STAGING project root URL");
          if (!process.env.SUPABASE_ANON_KEY) throw new Error("SUPABASE_ANON_KEY is missing");
          const parts = process.env.SUPABASE_ANON_KEY.split(".");
          if (parts.length === 3) {
            const payload = JSON.parse(Buffer.from(parts[1], "base64url").toString("utf8"));
            if (payload.ref && payload.ref !== "cbyvtehvaojxfcgpelir") throw new Error("SUPABASE_ANON_KEY belongs to a different Supabase project");
          }
          console.log("Staging endpoint validated; key value not displayed.");
          NODE
          test -n "$MYGRAM_TEST_USER_A_EMAIL"
          test -n "$MYGRAM_TEST_USER_A_PASSWORD"
          test -n "$MYGRAM_TEST_USER_B_EMAIL"
          test -n "$MYGRAM_TEST_USER_B_PASSWORD"
          test -n "$MYGRAM_TEST_USER_C_EMAIL"
          test -n "$MYGRAM_TEST_USER_C_PASSWORD"
      - name: Run Staging RLS integration test
        run: npx playwright test tests/staging-rls.spec.js --project=chromium-desktop
