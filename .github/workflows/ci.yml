name: MYGRAM Build and Quality Gate

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mygram-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, unit tests, Playwright, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Generate dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install from generated lock
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Test product registry
        run: npm test
      - name: Browser end-to-end tests
        run: npm run test:e2e
      - name: TypeScript validation and Vite build
        run: npm run build
      - name: Upload lockfile for repository pinning
        uses: actions/upload-artifact@v4
        with:
          name: MYGRAM-generated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
