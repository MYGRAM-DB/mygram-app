name: MYGRAM Build and Quality Gate

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mygram-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, unit tests, Playwright, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install from committed lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Test product registry
        run: npm test
      - name: Browser end-to-end tests
        run: npm run test:e2e
      - name: Two-user Staging Auth, RLS, and Storage integration
        if: ${{ vars.MYGRAM_STAGING_AUTHZ_TESTS == 'true' }}
        env:
          MYGRAM_STAGING_URL: ${{ vars.MYGRAM_STAGING_URL }}
          MYGRAM_STAGING_PUBLISHABLE_KEY: ${{ secrets.MYGRAM_STAGING_PUBLISHABLE_KEY }}
          MYGRAM_TEST_USER_A_EMAIL: ${{ secrets.MYGRAM_TEST_USER_A_EMAIL }}
          MYGRAM_TEST_USER_A_PASSWORD: ${{ secrets.MYGRAM_TEST_USER_A_PASSWORD }}
          MYGRAM_TEST_USER_B_EMAIL: ${{ secrets.MYGRAM_TEST_USER_B_EMAIL }}
          MYGRAM_TEST_USER_B_PASSWORD: ${{ secrets.MYGRAM_TEST_USER_B_PASSWORD }}
        run: npm run test:integration
      - name: TypeScript validation and Vite build
        run: npm run build
