name: MYGRAM Build and Quality Gate

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mygram-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, unit tests, Playwright, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install from committed lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Test product registry
        run: npm test
      - name: Browser end-to-end tests
        run: npm run test:e2e
      - name: Validate integration test syntax
        run: node --check tests/authz.integration.mjs
      - name: Validate Messenger A/B/C integration test syntax
        run: node --check tests/messenger-three-party.integration.mjs
      - name: TypeScript validation and Vite build
        run: npm run build


  staging-authz:
    name: Real JWT, Profile Privacy, Storage, Messenger A/B/C, and Realtime
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Run isolated Staging security suite with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          OIDC_RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=mygram-staging-qa")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_RESPONSE" | jq -er '.value')"
          unset OIDC_RESPONSE
          curl --fail --silent --show-error \
            --request POST \
            "https://cbyvtehvaojxfcgpelir.supabase.co/functions/v1/qa-messenger-abc" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{}'
          unset OIDC_TOKEN
