name: MYGRAM Build and Quality Gate

on:
  pull_request:
    branches: ["main", "rebuild/phase-a-architecture"]
  push:
    branches: ["main", "rebuild/phase-a-architecture"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mygram-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, Playwright, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund
      - name: Unit and contract tests
        run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end tests
        run: npm run test:e2e
      - name: Validate Staging integration test source
        run: |
          node --check tests/authz.integration.mjs
          node --check tests/messenger-three-party.integration.mjs
      - name: TypeScript validation and production build
        run: npm run build
