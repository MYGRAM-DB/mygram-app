name: Wallet staging integration tests

on:
  pull_request:
    paths:
      - "supabase/migrations/2026102900*.sql"
      - "supabase/tests/wallet_staging_smoke.sql"
      - ".github/workflows/wallet-staging-tests.yml"
  push:
    branches:
      - "staging/wallet-atomicity-airdrop"
    paths:
      - "supabase/migrations/2026102900*.sql"
      - "supabase/tests/wallet_staging_smoke.sql"
      - ".github/workflows/wallet-staging-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-isolated-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mygram_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mygram_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: mygram_test
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap isolated Supabase-compatible auth primitives
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;
          create role anon nologin;
          create role authenticated nologin;
          create schema auth;
          create table auth.users (
            id uuid primary key default gen_random_uuid(),
            email text unique,
            created_at timestamptz not null default now()
          );
          create or replace function auth.uid()
          returns uuid language sql stable
          as $$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          grant usage on schema auth to authenticated;
          grant execute on function auth.uid() to authenticated;
          SQL
      - name: Apply wallet draft migrations to disposable PostgreSQL only
        run: |
          for migration in \
            supabase/migrations/20261029000000_draft_wallets_ledger_and_import_schema.sql \
            supabase/migrations/20261029001000_draft_atomic_wallet_transfer.sql \
            supabase/migrations/20261029002000_draft_wallet_transfer_rpc_wrapper.sql \
            supabase/migrations/20261029003000_draft_wallet_service_catalog.sql \
            supabase/migrations/20261029004000_staging_welcome_grant_and_service_settlement.sql
          do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Run wallet staging smoke and invariant tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/wallet_staging_smoke.sql
