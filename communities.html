<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087cf0"><title>MYGRAM | المجتمعات</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="config.js"></script><script defer src="auth-guard.js"></script><script defer src="language.js"></script><script defer src="communities.js"></script><style>
.community-wrap{max-width:1050px;margin:24px auto;padding:0 14px}.community-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.community-card{padding:16px;min-width:0}.community-card h3{margin:0 0 6px}.community-card p{overflow-wrap:anywhere}.community-card button,.community-wrap form button{border:0;border-radius:10px;padding:10px 14px;background:#087cf0;color:white;cursor:pointer}.community-wrap form{display:grid;gap:10px}.community-wrap input,.community-wrap textarea{width:100%;padding:11px;border:1px solid #dce5f0;border-radius:10px;font:inherit}.community-wrap textarea{min-height:70px}.community-muted{color:#718096;font-size:13px}.community-post{padding:12px;border:1px solid #e5eaf2;border-radius:12px;margin:10px 0;overflow-wrap:anywhere}.community-actions{display:flex;gap:8px;flex-wrap:wrap}.community-detail{margin-top:18px;padding:16px}.community-actions button.secondary{background:#64748b}@media(max-width:600px){.community-wrap{padding:0 10px}}
</style>  <script defer src="notifications.js"></script>
</head><body>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="home.html">MYGRAM</a><nav><a href="home.html">الرئيسية</a> · <a href="people.html">الأصدقاء</a> · <a href="services.html">Messenger</a> · <a href="chat.html">Chat</a></nav></div></header>
<main class="community-wrap"><section class="card community-card"><h1>🌍 مجتمعات MYGRAM</h1><p class="community-muted">أنشئ مجتمعاً حول اهتماماتك، انضم إلى الآخرين، وشارك المنشورات مع الأعضاء.</p>
<form id="communityForm"><label for="communityName">اسم المجتمع</label><input id="communityName" maxlength="80" required placeholder="مثلاً: محبو التصوير"><label for="communityDescription">وصف المجتمع</label><textarea id="communityDescription" maxlength="500" placeholder="ما الذي يجمع أعضاء المجتمع؟"></textarea><button type="submit">إنشاء مجتمع</button></form></section>
<section style="margin-top:16px"><h2>استكشف المجتمعات</h2><div id="communityList" class="community-grid"><p>جارٍ تحميل المجتمعات…</p></div></section>
<section id="communityDetail" class="card community-detail" hidden><h2 id="communityTitle"></h2><p id="communityDescriptionText"></p><form id="communityPostForm"><label for="communityPostContent">منشور للمجتمع</label><textarea id="communityPostContent" maxlength="5000" required placeholder="شارك فكرة مع أعضاء المجتمع"></textarea><button type="submit">نشر داخل المجتمع</button></form><div id="communityPosts"></div></section>
<div id="communityToast" role="status" aria-live="polite" class="toast"></div></main></body></html>
